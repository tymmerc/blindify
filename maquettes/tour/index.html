<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blindify — Tour Club Analogique</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Karla',sans-serif;background:#f4ecdb;color:#2e2014;padding:60px 24px}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-family:'Fraunces',serif;font-size:2.4rem;margin-bottom:6px}
  h1 em{color:#c65133}
  p{color:#6b573f;margin-bottom:40px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px}
  figure{border:2px solid #2e2014;background:#ece1c8;box-shadow:4px 4px 0 rgba(46,32,20,.18)}
  img{width:100%;display:block;border-bottom:2px solid #2e2014}
  figcaption{padding:10px 14px;font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.14em}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Tour complet · <em>Club analogique</em></h1>
  <p>Toutes les pages de la vraie app après conversion. Build local, prod pas encore touchée.</p>
  <div class="grid">
    <figure><img src="tour-landing.png" alt="landing" loading="lazy"><figcaption>landing</figcaption></figure>
    <figure><img src="tour-modes.png" alt="modes" loading="lazy"><figcaption>modes</figcaption></figure>
    <figure><img src="tour-solo.png" alt="solo" loading="lazy"><figcaption>solo</figcaption></figure>
    <figure><img src="tour-friends.png" alt="friends" loading="lazy"><figcaption>friends</figcaption></figure>
    <figure><img src="tour-multiplayer.png" alt="multiplayer" loading="lazy"><figcaption>multiplayer</figcaption></figure>
    <figure><img src="tour-event.png" alt="event" loading="lazy"><figcaption>event</figcaption></figure>
    <figure><img src="tour-chrono.png" alt="chrono" loading="lazy"><figcaption>chrono</figcaption></figure>
    <figure><img src="tour-challenge.png" alt="challenge" loading="lazy"><figcaption>challenge</figcaption></figure>
    <figure><img src="tour-history.png" alt="history" loading="lazy"><figcaption>history</figcaption></figure>
    <figure><img src="tour-profile.png" alt="profile" loading="lazy"><figcaption>profile</figcaption></figure>
    <figure><img src="tour-settings.png" alt="settings" loading="lazy"><figcaption>settings</figcaption></figure>
    <figure><img src="tour-stats.png" alt="stats" loading="lazy"><figcaption>stats</figcaption></figure>
    <figure><img src="tour-login.png" alt="login" loading="lazy"><figcaption>login</figcaption></figure>
  </div></div></body></html>
