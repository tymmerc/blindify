<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blindify - Game (Cover Variant)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#0f1629;color:#E0E8F0;font-family:'Space Grotesk',sans-serif;height:100vh;overflow:hidden;position:relative}

  /* Ambient */
  .glow-1{position:fixed;top:-20%;left:30%;width:700px;height:700px;background:radial-gradient(circle,rgba(168,85,247,0.07),transparent 65%);pointer-events:none;animation:drift1 8s ease-in-out infinite alternate}
  .glow-2{position:fixed;bottom:-25%;right:20%;width:600px;height:600px;background:radial-gradient(circle,rgba(236,72,153,0.06),transparent 65%);pointer-events:none;animation:drift2 10s ease-in-out infinite alternate}
  @keyframes drift1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(40px,30px) scale(1.08)}}
  @keyframes drift2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-30px,-20px) scale(1.05)}}

  /* Layout */
  .layout{display:flex;height:100vh;position:relative;z-index:1}
  .main{flex:1;display:flex;flex-direction:column;padding:28px 48px 28px;min-width:0}
  .sidebar{width:360px;flex-shrink:0;background:rgba(22,30,55,0.85);backdrop-filter:blur(12px);border-left:1px solid rgba(148,163,184,0.12);display:flex;flex-direction:column}

  /* Top bar */
  .top-bar{display:flex;align-items:center;gap:20px;margin-bottom:12px}
  .round-badge{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:#a855f7;background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.25);border-radius:10px;padding:7px 14px;white-space:nowrap}
  .timer-bar-wrap{flex:1;height:6px;background:rgba(148,163,184,0.1);border-radius:3px;overflow:hidden}
  .timer-bar-fill{height:100%;background:linear-gradient(90deg,#a855f7,#ec4899);border-radius:3px;box-shadow:0 0 12px rgba(168,85,247,0.3);width:100%}
  .my-score{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:600;min-width:80px;text-align:right}
  .my-score small{color:#7b8ba3;font-weight:400;font-size:11px;margin-left:4px}

  /* Center zone */
  .center-zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative}

  /* Album cover */
  .album-cover-wrap{position:relative;width:240px;height:240px;border-radius:20px;overflow:hidden;border:1px solid rgba(148,163,184,0.15);box-shadow:0 20px 60px rgba(0,0,0,0.5);animation:breathe 4s ease-in-out infinite;transition:box-shadow 1.2s ease-out}
  .album-cover-wrap img{width:100%;height:100%;object-fit:cover;display:block;filter:blur(16px) brightness(0.5) saturate(1.3);transition:filter 1.2s ease-out}
  .album-cover-wrap::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(168,85,247,0.15),rgba(236,72,153,0.1));
    border-radius:20px;
    transition:opacity 1.2s ease-out;
    pointer-events:none;
  }

  /* Revealed state */
  .album-cover-wrap.revealed{animation:none;box-shadow:0 20px 80px rgba(168,85,247,0.2)}
  .album-cover-wrap.revealed img{filter:blur(0) brightness(0.85) saturate(1.1)}
  .album-cover-wrap.revealed::after{opacity:0}

  @keyframes breathe{0%,100%{transform:scale(0.98)}50%{transform:scale(1.02)}}

  /* Equalizer (below cover) */
  .equalizer{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:60px;margin-top:24px;transition:opacity 0.5s,transform 0.5s}
  .eq-bar{width:8px;border-radius:4px;background:linear-gradient(180deg,#ec4899,#a855f7);animation:eqB var(--d) ease-in-out infinite alternate;opacity:.85;box-shadow:0 0 8px rgba(168,85,247,.25)}
  @keyframes eqB{0%{height:var(--a)}100%{height:var(--b)}}

  /* Countdown (below bars) */
  .countdown{font-family:'JetBrains Mono',monospace;font-size:52px;font-weight:600;text-shadow:0 0 30px rgba(168,85,247,.2);letter-spacing:.05em;transition:all .4s;margin-top:16px}
  .countdown.urgent{color:#f87171;text-shadow:0 0 30px rgba(248,113,113,.3)}

  /* ===== REVEAL ===== */
  .reveal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .5s}
  .reveal.visible{opacity:1;pointer-events:auto}
  .reveal-album{width:160px;height:160px;border-radius:16px;background:rgba(22,30,55,.9);border:1px solid rgba(148,163,184,.15);display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .reveal-album.pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  .reveal-title{font-size:28px;font-weight:700;letter-spacing:-.02em;text-align:center}
  .reveal-artist{font-size:18px;color:#8896b0}
  .reveal-line{animation:fadeUp .5s both}
  .reveal-line:nth-child(2){animation-delay:.15s}.reveal-line:nth-child(3){animation-delay:.3s}.reveal-line:nth-child(4){animation-delay:.45s}.reveal-line:nth-child(5){animation-delay:.6s}.reveal-line:nth-child(6){animation-delay:.75s}
  @keyframes fadeUp{0%{transform:translateY(14px);opacity:0}100%{transform:translateY(0);opacity:1}}

  /* Reveal source player */
  .reveal-source{display:flex;align-items:center;gap:12px;padding:10px 22px;border-radius:12px;background:rgba(22,30,55,.85);border:1px solid rgba(148,163,184,.12)}
  .reveal-source img{width:32px;height:32px;border-radius:50%;border:2px solid rgba(236,72,153,.4)}
  .reveal-source .src-label{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7b8ba3}
  .reveal-source .src-name{color:#ec4899;font-weight:600}

  /* Reveal result badges */
  .reveal-badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .rbadge{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;padding:6px 14px;border-radius:8px}
  .rbadge.ok{color:#22c55e;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25)}
  .rbadge.fail{color:#f87171;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25)}
  .rbadge.partial{color:#fbbf24;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25)}

  /* Points popup */
  .pts-pop{position:absolute;top:45%;left:50%;font-family:'JetBrains Mono',monospace;font-size:56px;font-weight:700;opacity:0;pointer-events:none;text-shadow:0 0 40px currentColor}
  .pts-pop.go{animation:ptsUp 1.6s ease-out forwards}
  @keyframes ptsUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}35%{transform:translate(-50%,-80%) scale(1)}100%{opacity:0;transform:translate(-50%,-160%) scale(.7)}}

  /* ===== INPUT ZONE ===== */
  .input-zone{max-width:820px;width:100%;margin:0 auto;transition:opacity .4s}
  .input-zone.hidden{opacity:.2;pointer-events:none}
  .input-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
  .input-label{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#8896b0;margin-bottom:6px;display:block}
  .game-input{width:100%;background:rgba(12,18,35,.9);border:1px solid rgba(148,163,184,.15);border-radius:14px;padding:18px 20px;font-family:'Space Grotesk',sans-serif;font-size:17px;color:#E0E8F0;outline:none;transition:border-color .2s,box-shadow .2s}
  .game-input:focus{border-color:rgba(168,85,247,.35);box-shadow:0 0 18px rgba(168,85,247,.08)}
  .game-input::placeholder{color:#5a6a82}

  /* Who added - avatar picker */
  .who-row{margin-bottom:14px}
  .who-avatars{display:flex;gap:10px;flex-wrap:wrap}
  .who-btn{
    display:flex;align-items:center;gap:8px;
    padding:8px 14px 8px 8px;border-radius:12px;
    background:rgba(12,18,35,.9);border:2px solid rgba(148,163,184,.1);
    cursor:pointer;transition:all .2s;
  }
  .who-btn:hover{border-color:rgba(148,163,184,.25);background:rgba(18,24,42,1)}
  .who-btn.selected{border-color:rgba(236,72,153,.5);background:rgba(236,72,153,.08);box-shadow:0 0 16px rgba(236,72,153,.1)}
  .who-btn img{width:28px;height:28px;border-radius:50%;object-fit:cover}
  .who-btn span{font-size:13px;font-weight:500;color:#8896b0}
  .who-btn.selected span{color:#E0E8F0}

  .btn-validate{display:block;width:100%;padding:20px 32px;font-size:18px;font-weight:600;color:#fff;background:linear-gradient(135deg,#a855f7,#ec4899);border:none;border-radius:14px;cursor:pointer;transition:all .25s;box-shadow:0 0 24px rgba(168,85,247,.15)}
  .btn-validate:hover{box-shadow:0 0 32px rgba(168,85,247,.25);transform:translateY(-2px)}
  .pass-link{display:block;text-align:center;margin-top:12px;font-size:14px;color:#7b8ba3;text-decoration:none;cursor:pointer}

  /* ===== SCOREBOARD TAKEOVER ===== */
  .scoreboard-overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(10,14,24,.92);backdrop-filter:blur(20px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .5s;
  }
  .scoreboard-overlay.visible{opacity:1;pointer-events:auto}
  .sb-title{font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.15em;color:#7b8ba3;margin-bottom:32px}
  .sb-list{display:flex;flex-direction:column;gap:0;width:480px;position:relative}
  .sb-row{
    display:flex;align-items:center;gap:14px;
    padding:16px 20px;
    border-radius:14px;
    border:1px solid transparent;
    position:relative;
    transition:transform .8s cubic-bezier(.4,0,.2,1), background .4s, border-color .4s;
  }
  .sb-row.me{border-color:rgba(168,85,247,.3);background:rgba(168,85,247,.06)}
  .sb-row.first{border-color:rgba(251,191,36,.2);background:rgba(251,191,36,.04)}
  .sb-rank{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;width:32px;text-align:center;color:#7b8ba3;transition:color .5s}
  .sb-row.first .sb-rank{color:#fbbf24;text-shadow:0 0 12px rgba(251,191,36,.3)}
  .sb-row.me .sb-rank{color:#a855f7}
  .sb-img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid transparent}
  .sb-row.first .sb-img{border-color:rgba(251,191,36,.4)}
  .sb-row.me .sb-img{border-color:rgba(168,85,247,.4)}
  .sb-name{flex:1;font-size:16px;font-weight:600}
  .sb-pts{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:#8896b0;min-width:60px;text-align:right;transition:color .3s}
  .sb-pts.counting{color:#E0E8F0}
  .sb-delta{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:#22c55e;min-width:50px;text-align:right;opacity:0;transition:opacity .3s}
  .sb-delta.show{opacity:1}
  .sb-delta.zero{color:#f87171}

  /* Bar behind score */
  .sb-bar{position:absolute;left:0;top:0;bottom:0;border-radius:14px;background:linear-gradient(90deg,rgba(168,85,247,.06),transparent);transition:width 1s ease-out;z-index:-1}

  /* Arrow indicators */
  .sb-arrow{font-size:14px;margin-left:4px;opacity:0;transition:opacity .4s}
  .sb-arrow.up{color:#22c55e;opacity:1}
  .sb-arrow.down{color:#f87171;opacity:1}

  /* ===== SIDEBAR (mini) ===== */
  .sidebar-section{padding:18px}
  .sidebar-header{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#7b8ba3;margin-bottom:14px}
  .player-list{list-style:none;display:flex;flex-direction:column;gap:4px}
  .player-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid transparent;transition:all .5s}
  .player-row.me{border-color:rgba(168,85,247,.25);background:rgba(168,85,247,.06)}
  .player-row.first .p-rank{color:#fbbf24}
  .p-rank{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:#7b8ba3;width:18px;text-align:center}
  .p-img{width:24px;height:24px;border-radius:50%;object-fit:cover}
  .p-name{flex:1;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-score{font-family:'JetBrains Mono',monospace;font-size:12px;color:#7b8ba3;min-width:32px;text-align:right}

  .sidebar-divider{height:1px;background:rgba(148,163,184,.1)}

  /* Chat */
  .chat-section{flex:1;display:flex;flex-direction:column;padding:18px;min-height:0}
  .chat-messages{flex:1;display:flex;flex-direction:column;gap:8px;overflow-y:auto;margin-bottom:12px}
  .chat-msg{font-size:13px;line-height:1.4;opacity:0;animation:chatIn .3s ease-out forwards}
  @keyframes chatIn{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
  .chat-msg .author{font-weight:600;margin-right:5px}
  .chat-msg .text{color:#7b8ba3}
  .chat-input{width:100%;background:rgba(12,18,35,.9);border:1px solid rgba(148,163,184,.15);border-radius:10px;padding:10px 14px;font-family:'Space Grotesk',sans-serif;font-size:13px;color:#E0E8F0;outline:none}
  .chat-input::placeholder{color:#3d4a5c}

  .phase-label{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#4a5568;z-index:60;padding:4px 12px;border-radius:6px;background:rgba(12,18,35,.8);border:1px solid rgba(148,163,184,.06)}
</style>
</head>
<body>
<div class="glow-1"></div><div class="glow-2"></div>

<div class="layout">
  <div class="main">
    <div class="top-bar">
      <div class="round-badge" id="roundBadge">Round 1/5</div>
      <div class="timer-bar-wrap"><div class="timer-bar-fill" id="timerBar"></div></div>
      <div class="my-score" id="myScore">280<small>pts</small></div>
    </div>
    <div class="center-zone">
      <div class="album-cover-wrap" id="albumCover">
        <img src="https://picsum.photos/400/400?random=2" alt="Album cover">
      </div>
      <div class="equalizer" id="eq">
        <div class="eq-bar" style="--a:6px;--b:30px;--d:.52s"></div>
        <div class="eq-bar" style="--a:8px;--b:40px;--d:.44s"></div>
        <div class="eq-bar" style="--a:7px;--b:42px;--d:.42s"></div>
        <div class="eq-bar" style="--a:10px;--b:55px;--d:.55s"></div>
        <div class="eq-bar" style="--a:6px;--b:44px;--d:.38s"></div>
        <div class="eq-bar" style="--a:12px;--b:58px;--d:.62s"></div>
        <div class="eq-bar" style="--a:8px;--b:50px;--d:.48s"></div>
        <div class="eq-bar" style="--a:11px;--b:56px;--d:.53s"></div>
        <div class="eq-bar" style="--a:5px;--b:38px;--d:.35s"></div>
        <div class="eq-bar" style="--a:9px;--b:54px;--d:.58s"></div>
        <div class="eq-bar" style="--a:6px;--b:46px;--d:.44s"></div>
        <div class="eq-bar" style="--a:13px;--b:60px;--d:.50s"></div>
        <div class="eq-bar" style="--a:7px;--b:48px;--d:.40s"></div>
        <div class="eq-bar" style="--a:10px;--b:52px;--d:.56s"></div>
        <div class="eq-bar" style="--a:6px;--b:36px;--d:.46s"></div>
        <div class="eq-bar" style="--a:9px;--b:50px;--d:.60s"></div>
      </div>
      <div class="countdown" id="cd">0:30</div>
      <div class="reveal" id="reveal"></div>
      <div class="pts-pop" id="ptsPop"></div>
    </div>
    <div class="input-zone" id="inputZone">
      <div class="input-row">
        <div><label class="input-label">Titre</label><input class="game-input" placeholder="Quel titre ?"></div>
        <div><label class="input-label">Artiste</label><input class="game-input" placeholder="Quel artiste ?"></div>
      </div>
      <div class="who-row">
        <label class="input-label">Qui a ajoute ce titre ?</label>
        <div class="who-avatars" id="whoAvatars"></div>
      </div>
      <button class="btn-validate">Valider</button>
      <a class="pass-link">Passer</a>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-header">Classement</div>
      <ul class="player-list" id="sideList"></ul>
    </div>
    <div class="sidebar-divider"></div>
    <div class="chat-section">
      <div class="sidebar-header">Chat</div>
      <div class="chat-messages" id="chat"></div>
      <input class="chat-input" placeholder="Message...">
    </div>
  </div>
</div>

<!-- Scoreboard fullscreen -->
<div class="scoreboard-overlay" id="sbOverlay">
  <div class="sb-title" id="sbTitle">Classement apres le round 1</div>
  <div class="sb-list" id="sbList"></div>
</div>

<div class="phase-label" id="phase">demo auto</div>

<script>
const P = [
  {n:"DJ_Korsika",img:3,s:320,me:false,c:"#fbbf24"},
  {n:"Toi",img:8,s:280,me:true,c:"#a855f7"},
  {n:"MeloManiac",img:12,s:260,me:false,c:"#ec4899"},
  {n:"BassHunter42",img:20,s:200,me:false,c:"#22d3ee"},
  {n:"Vinyl_addict",img:25,s:180,me:false,c:"#34d399"},
];
const T = [
  {title:"Bohemian Rhapsody",artist:"Queen",emoji:"\u{1F451}",owner:"MeloManiac",oi:12,r:"correct",tp:80,ap:40,sp:30},
  {title:"Lose Yourself",artist:"Eminem",emoji:"\u{1F3A4}",owner:"DJ_Korsika",oi:3,r:"correct",tp:70,ap:30,sp:0},
  {title:"Blinding Lights",artist:"The Weeknd",emoji:"\u{1F319}",owner:"BassHunter42",oi:20,r:"partial",tp:40,ap:0,sp:0},
  {title:"Billie Jean",artist:"Michael Jackson",emoji:"\u{1F57A}",owner:"Vinyl_addict",oi:25,r:"wrong",tp:0,ap:0,sp:0},
  {title:"Smells Like Teen Spirit",artist:"Nirvana",emoji:"\u{1F525}",owner:"MeloManiac",oi:12,r:"correct",tp:90,ap:40,sp:30},
];
const chatData=[
  ["DJ_Korsika","#fbbf24","trop facile \u{1F60E}"],["MeloManiac","#ec4899","reconnu en 2 sec"],
  ["BassHunter42","#22d3ee","attendez le drop..."],["Toi","#a855f7","je connais!"],
  ["Vinyl_addict","#34d399","gg"],["MeloManiac","#ec4899","allez la suite"],
  ["DJ_Korsika","#fbbf24","imbattable \u{1F4AA}"],["BassHunter42","#22d3ee","on verra \u{1F60F}"],
  ["Toi","#a855f7","easy"],["MeloManiac","#ec4899","wow celle-la!"],
  ["Vinyl_addict","#34d399","j'avais pas celle-la"],["DJ_Korsika","#fbbf24","classic"],
];
let ci=0,myS=280;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function addChat(){
  const[a,c,t]=chatData[ci%chatData.length];ci++;
  const d=document.createElement('div');d.className='chat-msg';
  d.innerHTML=`<span class="author" style="color:${c}">${a}</span><span class="text">${t}</span>`;
  $('chat').appendChild(d);$('chat').scrollTop=9999;
}

function sorted(){return[...P].sort((a,b)=>b.s-a.s)}

function renderSide(){
  const s=sorted();
  $('sideList').innerHTML=s.map((p,i)=>`
    <li class="player-row${p.me?' me':''}${i===0?' first':''}">
      <span class="p-rank">${i+1}</span>
      <img class="p-img" src="https://i.pravatar.cc/48?img=${p.img}">
      <span class="p-name">${p.n}</span>
      <span class="p-score">${p.s}</span>
    </li>`).join('');
}

function renderWhoAvatars(){
  $('whoAvatars').innerHTML=P.filter(p=>!p.me).map(p=>`
    <div class="who-btn" data-name="${p.n}">
      <img src="https://i.pravatar.cc/56?img=${p.img}">
      <span>${p.n}</span>
    </div>`).join('');
  $('whoAvatars').querySelectorAll('.who-btn').forEach(b=>{
    b.onclick=()=>{
      $('whoAvatars').querySelectorAll('.who-btn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
    };
  });
}

function countUp(el,from,to,dur=900){
  const st=performance.now();
  el.classList?.add('counting');
  (function tick(now){
    const t=Math.min((now-st)/dur,1);
    const v=Math.round(from+(to-from)*(1-Math.pow(1-t,3)));
    el.textContent=v;
    if(t<1)requestAnimationFrame(tick);
    else el.classList?.remove('counting');
  })(performance.now());
}

// ===== SCOREBOARD PHASE =====
async function showScoreboard(roundNum, deltas){
  const overlay=$('sbOverlay');
  const list=$('sbList');
  $('sbTitle').textContent=`Classement apres le round ${roundNum}`;

  // Build rows in OLD order first
  const oldSorted=sorted();
  // Apply deltas
  deltas.forEach(d=>{const p=P.find(x=>x.n===d.n);if(p)p.s+=d.pts;});
  myS=P.find(p=>p.me).s;

  // Render in OLD order
  const maxScore=Math.max(...P.map(p=>p.s));
  list.innerHTML=oldSorted.map((p,i)=>{
    const delta=deltas.find(d=>d.n===p.n);
    const pts=delta?delta.pts:0;
    const oldScore=p.s-pts;
    return`<div class="sb-row${p.me?' me':''}${i===0?' first':''}" data-name="${p.n}" style="order:${i}">
      <div class="sb-bar" style="width:${Math.round(oldScore/maxScore*100)}%"></div>
      <span class="sb-rank">${i+1}</span>
      <img class="sb-img" src="https://i.pravatar.cc/72?img=${p.img}">
      <span class="sb-name">${p.n}</span>
      <span class="sb-delta${pts===0?' zero':''}" id="sbd_${p.n}">${pts>0?'+'+pts:'0'}</span>
      <span class="sb-pts" id="sbp_${p.n}">${oldScore}</span>
      <span class="sb-arrow" id="sba_${p.n}"></span>
    </div>`;
  }).join('');

  overlay.classList.add('visible');
  await sleep(600);

  // Phase 1: show deltas
  list.querySelectorAll('.sb-delta').forEach(el=>el.classList.add('show'));
  await sleep(500);

  // Phase 2: count up scores
  P.forEach(p=>{
    const delta=deltas.find(d=>d.n===p.n);
    const pts=delta?delta.pts:0;
    const el=document.getElementById('sbp_'+p.n);
    if(el)countUp(el,p.s-pts,p.s,1200);
    // Update bar width
    const row=list.querySelector(`[data-name="${p.n}"] .sb-bar`);
    if(row) row.style.width=Math.round(p.s/maxScore*100)+'%';
  });
  await sleep(1400);

  // Phase 3: reorder with animation
  const newSorted=sorted();
  const rowH=73; // approximate row height + gap
  newSorted.forEach((p,newIdx)=>{
    const row=list.querySelector(`[data-name="${p.n}"]`);
    const oldIdx=oldSorted.findIndex(x=>x.n===p.n);
    if(oldIdx!==newIdx){
      const diff=newIdx-oldIdx;
      row.style.transform=`translateY(${diff*rowH}px)`;
      // Arrow
      const arrow=document.getElementById('sba_'+p.n);
      if(arrow){
        arrow.textContent=diff<0?'\u25B2':'\u25BC';
        arrow.className='sb-arrow '+(diff<0?'up':'down');
      }
    }
    // Update rank number
    const rankEl=row.querySelector('.sb-rank');
    rankEl.textContent=newIdx+1;
    // Update classes
    row.classList.remove('first','me');
    if(p.me)row.classList.add('me');
    if(newIdx===0)row.classList.add('first');
  });
  await sleep(1200);

  // Update header score
  $('myScore').innerHTML=`${myS}<small>pts</small>`;
  renderSide();
  await sleep(800);

  overlay.classList.remove('visible');
  await sleep(500);
}

// ===== ROUND =====
async function playRound(t,num){
  $('roundBadge').textContent=`Round ${num}/5`;
  $('phase').textContent=`ecoute (round ${num})`;

  // Reset
  $('reveal').classList.remove('visible');$('reveal').innerHTML='';
  $('eq').style.opacity='1';$('eq').style.transform='scale(1)';
  $('inputZone').classList.remove('hidden');
  $('cd').classList.remove('urgent');$('cd').style.opacity='1';
  renderWhoAvatars();

  // Reset album cover to blurred state
  $('albumCover').classList.remove('revealed');
  // Swap to a new random cover image each round
  $('albumCover').querySelector('img').src='https://picsum.photos/400/400?random='+((num*7)+2);

  // Timer
  const dur=7;
  $('timerBar').style.transition='none';$('timerBar').style.width='100%';
  await sleep(30);
  $('timerBar').style.transition=`width ${dur}s linear`;$('timerBar').style.width='0%';

  for(let s=dur;s>=0;s--){
    $('cd').textContent=`0:${String(s).padStart(2,'0')}`;
    if(s<=3)$('cd').classList.add('urgent');
    if(s>0){if(s===dur-2||s===dur-5)addChat();await sleep(1000);}
  }

  // === REVEAL ===
  $('phase').textContent='reveal';
  $('eq').style.opacity='.12';$('eq').style.transform='scale(.75)';
  $('cd').style.opacity='0';
  $('inputZone').classList.add('hidden');

  // Lift the blur on the album cover
  $('albumCover').classList.add('revealed');

  const gotTitle=t.r==='correct'||t.r==='partial';
  const gotArtist=t.r==='correct';
  const gotSource=t.r==='correct';

  $('reveal').innerHTML=`
    <div class="reveal-album pop reveal-line">${t.emoji}</div>
    <div class="reveal-title reveal-line">${t.title}</div>
    <div class="reveal-artist reveal-line">${t.artist}</div>
    <div class="reveal-source reveal-line">
      <img src="https://i.pravatar.cc/64?img=${t.oi}">
      <span class="src-label">Dans la playlist de <strong class="src-name">${t.owner}</strong></span>
    </div>
    <div class="reveal-badges reveal-line">
      <span class="rbadge ${gotTitle?'ok':'fail'}">Titre ${gotTitle?'\u2713':'\u2717'}</span>
      <span class="rbadge ${gotArtist?'ok':'fail'}">Artiste ${gotArtist?'\u2713':'\u2717'}</span>
      <span class="rbadge ${gotSource?'ok':'fail'}">Source ${gotSource?'\u2713':'\u2717'}</span>
    </div>
  `;
  $('reveal').classList.add('visible');

  await sleep(1200);

  // Points popup
  const totalPts=t.tp+t.ap+t.sp;
  if(totalPts>0){
    $('ptsPop').textContent=`+${totalPts}`;
    $('ptsPop').style.color=t.r==='correct'?'#22c55e':'#fbbf24';
    $('ptsPop').className='pts-pop go';
  }
  addChat();
  await sleep(2000);
  $('ptsPop').className='pts-pop';
  $('reveal').classList.remove('visible');
  await sleep(300);

  // === SCOREBOARD ===
  const deltas=[
    {n:'Toi',pts:totalPts},
    ...P.filter(p=>!p.me).map(p=>({n:p.n,pts:Math.random()>.35?Math.floor(Math.random()*80)+20:0}))
  ];
  await showScoreboard(num,deltas);
}

// ===== GO =====
(async()=>{
  renderSide();renderWhoAvatars();
  addChat();await sleep(400);addChat();

  for(let i=0;i<T.length;i++){
    await playRound(T[i],i+1);
    await sleep(600);
  }
  $('phase').textContent='demo terminee';
  $('eq').style.opacity='1';$('eq').style.transform='scale(1)';
  $('albumCover').classList.add('revealed');
  $('cd').style.opacity='1';$('cd').textContent='GG';$('cd').classList.remove('urgent');
  $('inputZone').classList.add('hidden');
})();
</script>
