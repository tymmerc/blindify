<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blindify - Game (Arcade HUD)</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --pink:#ff2ec8; --cyan:#00f7ff; --yellow:#ffea00; --purple:#a855f7;
    --bg:#0a0014; --line:rgba(255,255,255,.08);
    --font-display:'Audiowide',cursive;
    --font-mono:'JetBrains Mono',monospace;
    --font-body:'Space Grotesk',sans-serif;
  }
  html,body{height:100%}
  body{
    background:var(--bg); color:#f5e8ff; font-family:var(--font-body);
    overflow:hidden; position:relative; min-height:100vh;
  }

  /* Ambient synthwave background */
  .sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .sky::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 50% 80%, rgba(255,46,200,.18) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 110%, rgba(168,85,247,.35) 0%, transparent 60%);
  }
  .sun{
    position:absolute; bottom:38vh; left:50%; transform:translateX(-50%);
    width:340px; height:340px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,46,200,.55) 0%, rgba(168,85,247,.25) 35%, transparent 65%);
    filter:blur(6px);
  }
  .grid{
    position:absolute; left:0; right:0; bottom:0; height:50vh;
    background-image:
      linear-gradient(rgba(255,46,200,.18) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,247,255,.18) 1px, transparent 1px);
    background-size:60px 60px;
    transform:perspective(360px) rotateX(60deg);
    transform-origin:center top;
    mask-image:linear-gradient(to top, black 40%, transparent 90%);
    animation:grid-pan 18s linear infinite;
  }
  @keyframes grid-pan{from{background-position:0 0,0 0}to{background-position:0 60px,60px 0}}

  /* Scanlines overlay */
  .scanlines{
    position:fixed; inset:0; z-index:50; pointer-events:none;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.22) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply; opacity:.35;
  }

  /* ===== Layout ===== */
  .stage{
    position:relative; z-index:1;
    display:grid; grid-template-rows:auto 1fr auto;
    height:100vh; padding:18px 22px;
    gap:14px;
  }

  /* ===== TOP HUD (VS bar) ===== */
  .hud{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center; gap:18px;
  }
  /* Player card */
  .pcard{
    display:flex; align-items:center; gap:12px;
    padding:10px 14px; min-height:60px;
    border:1.5px solid var(--cyan); border-radius:2px;
    background:linear-gradient(180deg, rgba(0,247,255,.07), rgba(0,247,255,.02));
    box-shadow:0 0 22px rgba(0,247,255,.18), inset 0 0 18px rgba(0,247,255,.08);
    position:relative;
    clip-path:polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
  }
  .pcard.right{
    border-color:var(--pink);
    background:linear-gradient(180deg, rgba(255,46,200,.08), rgba(255,46,200,.02));
    box-shadow:0 0 22px rgba(255,46,200,.18), inset 0 0 18px rgba(255,46,200,.08);
    clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 100%, 14px 100%);
    justify-content:flex-end;
  }
  .pavatar{
    width:46px; height:46px; flex-shrink:0;
    display:grid; place-items:center;
    border:1.5px solid var(--cyan); background:rgba(0,247,255,.1);
    font-family:var(--font-display); font-size:22px; color:var(--cyan);
    text-shadow:0 0 8px var(--cyan); border-radius:2px;
  }
  .pcard.right .pavatar{ border-color:var(--pink); background:rgba(255,46,200,.1); color:var(--pink); text-shadow:0 0 8px var(--pink); }
  .pinfo{display:flex;flex-direction:column;gap:4px;min-width:0}
  .pname{
    font-family:var(--font-display); font-size:18px; letter-spacing:.06em;
    color:#fff; text-shadow:0 0 6px rgba(255,255,255,.45);
    text-transform:uppercase; line-height:1; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:160px;
  }
  .pscore{
    font-family:var(--font-mono); font-size:13px; font-weight:600; color:var(--cyan);
    text-shadow:0 0 6px var(--cyan); letter-spacing:.08em;
  }
  .pcard.right .pname{text-align:right}
  .pcard.right .pinfo{align-items:flex-end}
  .pcard.right .pscore{color:var(--pink); text-shadow:0 0 6px var(--pink)}

  /* Status pill (left of name) */
  .pstatus{
    font-family:var(--font-mono); font-size:9px; letter-spacing:.18em; color:rgba(245,232,255,.55);
  }
  .pstatus.locked{color:var(--yellow); text-shadow:0 0 6px var(--yellow)}

  /* Score bars below cards */
  .pcard::after{
    content:""; position:absolute; left:14px; right:14px; bottom:6px;
    height:3px; background:rgba(255,255,255,.06); border-radius:2px;
  }

  /* Middle: round + timer */
  .meta{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:0 18px;
  }
  .round{
    font-family:var(--font-mono); font-size:10px; letter-spacing:.32em; color:var(--purple);
    text-shadow:0 0 6px rgba(168,85,247,.5);
  }
  .timer{
    font-family:var(--font-display); font-size:46px; line-height:1;
    color:var(--yellow); text-shadow:0 0 18px var(--yellow), 0 0 36px rgba(255,234,0,.5);
    letter-spacing:.04em;
    animation:flicker 3s infinite steps(20);
  }
  @keyframes flicker{
    0%,16%,20%,40%,60%,82%,100%{opacity:1}
    18%{opacity:.7} 41%{opacity:.85} 83%{opacity:.78}
  }
  .timer-bar{
    width:100%; max-width:220px; height:5px; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,234,0,.4); border-radius:1px; overflow:hidden;
    position:relative;
  }
  .timer-bar > span{
    position:absolute; left:0; top:0; bottom:0; width:62%;
    background:linear-gradient(90deg, var(--yellow), var(--pink));
    box-shadow:0 0 10px var(--yellow);
    animation:tcount 22s linear forwards;
  }
  @keyframes tcount{from{width:100%}to{width:0%}}

  /* ===== MIDDLE: Vinyl + Inputs ===== */
  .play{
    display:grid; grid-template-columns:1.05fr 1fr; gap:24px;
    align-items:center; min-height:0;
  }

  /* Vinyl arena */
  .arena{
    position:relative;
    aspect-ratio:1/1;
    max-height:62vh;
    margin:0 auto; width:100%;
    display:grid; place-items:center;
  }
  .arena::before{
    content:""; position:absolute; inset:-6%;
    background:radial-gradient(circle, rgba(255,46,200,.32) 0%, transparent 60%);
    filter:blur(8px); z-index:0;
  }
  .frame{
    position:absolute; inset:-2px;
    pointer-events:none;
  }
  .frame::before, .frame::after, .frame > i, .frame > b{
    content:""; position:absolute; width:30px; height:30px;
    border:2px solid var(--cyan);
    box-shadow:0 0 12px var(--cyan);
  }
  .frame::before{top:0; left:0; border-right:none; border-bottom:none}
  .frame::after{top:0; right:0; border-left:none; border-bottom:none}
  .frame > i{bottom:0; left:0; border-right:none; border-top:none}
  .frame > b{bottom:0; right:0; border-left:none; border-top:none}

  .vinyl{
    position:relative; width:80%; height:80%; border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, #1a0030 0%, #08000f 70%);
    box-shadow:
      0 0 0 1px rgba(255,46,200,.25),
      0 0 60px rgba(255,46,200,.4),
      inset 0 0 90px rgba(168,85,247,.12);
    animation:spin 16s linear infinite;
    cursor:grab;
  }
  .vinyl::before{
    content:""; position:absolute; inset:0; border-radius:50%;
    background:
      repeating-radial-gradient(circle at 50% 50%, transparent 0px, transparent 6px, rgba(255,255,255,.04) 7px, transparent 8px);
    mix-blend-mode:screen;
  }
  /* Blurred album cover floating in vinyl */
  .vinyl::after{
    content:""; position:absolute; inset:28%; border-radius:50%;
    background:
      radial-gradient(circle at 30% 35%, #ff2ec8 0%, transparent 45%),
      radial-gradient(circle at 70% 65%, #00f7ff 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, #a855f7 0%, transparent 60%),
      #1a0030;
    filter:blur(18px) saturate(1.4);
    box-shadow:inset 0 0 40px rgba(0,0,0,.6), 0 0 30px rgba(255,46,200,.35);
  }
  .vinyl-center{
    position:absolute; inset:48%; border-radius:50%;
    background:#0a0014; border:1.5px solid var(--pink);
    box-shadow:0 0 12px var(--pink);
    z-index:2;
  }
  .vinyl-center::after{
    content:""; position:absolute; inset:35%; border-radius:50%;
    background:radial-gradient(circle, var(--pink), #1a0030);
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Tooltip on arena */
  .arena-label{
    position:absolute; top:6%; left:50%; transform:translateX(-50%);
    font-family:var(--font-mono); font-size:10px; letter-spacing:.32em;
    color:rgba(0,247,255,.7); text-shadow:0 0 6px rgba(0,247,255,.4);
    z-index:3; white-space:nowrap;
  }
  .arena-label::before{content:"[ "; color:rgba(0,247,255,.4)}
  .arena-label::after{content:" ]"; color:rgba(0,247,255,.4)}
  .arena-hint{
    position:absolute; bottom:4%; left:50%; transform:translateX(-50%);
    font-family:var(--font-mono); font-size:9px; letter-spacing:.25em;
    color:rgba(245,232,255,.4); text-transform:uppercase; z-index:3; white-space:nowrap;
  }

  /* Right side: answer panel */
  .answer{
    display:flex; flex-direction:column; gap:14px;
    padding:18px 18px 16px;
    background:linear-gradient(180deg, rgba(20,5,40,.85), rgba(10,0,20,.85));
    border:1px solid rgba(255,46,200,.18);
    backdrop-filter:blur(20px);
    box-shadow:0 0 40px rgba(255,46,200,.08), inset 0 0 30px rgba(168,85,247,.06);
    border-radius:2px;
    position:relative;
  }
  .answer::before{
    content:"[ ANSWER_PANEL ]";
    position:absolute; top:-9px; left:18px;
    font-family:var(--font-mono); font-size:10px; letter-spacing:.28em;
    color:var(--pink); background:var(--bg); padding:0 8px;
    text-shadow:0 0 6px var(--pink);
  }

  .field{display:flex; flex-direction:column; gap:6px}
  .flabel{
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-mono); font-size:10px; letter-spacing:.22em;
    color:rgba(245,232,255,.55); text-transform:uppercase;
  }
  .flabel .tag{
    font-family:var(--font-mono); font-size:8px; padding:1px 5px;
    background:rgba(0,247,255,.15); color:var(--cyan); letter-spacing:.18em;
  }
  .input{
    width:100%; background:rgba(8,0,18,.7);
    border:1px solid rgba(255,255,255,.1);
    border-radius:2px; padding:11px 14px;
    color:#fff; font-family:var(--font-body); font-size:14px;
    outline:none; transition:border-color .2s, box-shadow .2s;
  }
  .input:focus, .input.filled{
    border-color:var(--cyan);
    box-shadow:0 0 14px rgba(0,247,255,.3), inset 0 0 12px rgba(0,247,255,.04);
  }
  .input::placeholder{color:rgba(245,232,255,.25)}

  /* Who-added picker */
  .picker{display:flex; gap:8px; flex-wrap:wrap}
  .pick{
    flex:1; min-width:0;
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; border-radius:2px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(8,0,18,.5);
    cursor:pointer; transition:all .2s; position:relative;
  }
  .pick:hover{border-color:var(--purple); background:rgba(168,85,247,.08)}
  .pick.selected{
    border-color:var(--yellow); background:rgba(255,234,0,.08);
    box-shadow:0 0 14px rgba(255,234,0,.25);
  }
  .pick.selected::before{
    content:"✓"; position:absolute; top:3px; right:5px;
    font-size:10px; color:var(--yellow); text-shadow:0 0 4px var(--yellow);
  }
  .pick-avatar{
    width:24px; height:24px; flex-shrink:0;
    display:grid; place-items:center;
    border:1px solid currentColor; border-radius:2px;
    font-family:var(--font-display); font-size:12px;
  }
  .pick.cy .pick-avatar{color:var(--cyan)}
  .pick.pk .pick-avatar{color:var(--pink)}
  .pick.pu .pick-avatar{color:var(--purple)}
  .pick.yl .pick-avatar{color:var(--yellow)}
  .pick-name{
    font-family:var(--font-mono); font-size:11px; color:#f5e8ff;
    letter-spacing:.06em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* Validate button */
  .submit{
    margin-top:6px;
    padding:14px 22px;
    font-family:var(--font-display); font-size:18px; letter-spacing:.18em;
    background:linear-gradient(180deg, rgba(255,234,0,.08), rgba(255,234,0,.02));
    border:2px solid var(--yellow); color:var(--yellow);
    text-shadow:0 0 10px var(--yellow), 0 0 24px rgba(255,234,0,.5);
    text-transform:uppercase; cursor:pointer;
    clip-path:polygon(18px 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
    position:relative; overflow:hidden;
    animation:breathe 2s ease-in-out infinite;
    transition:transform .15s;
  }
  .submit:hover{transform:translateY(-1px)}
  .submit::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,234,0,.2), transparent);
    transform:translateX(-100%);
    animation:sweep 3s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{box-shadow:0 0 18px rgba(255,234,0,.28), inset 0 0 12px rgba(255,234,0,.15)}50%{box-shadow:0 0 32px rgba(255,234,0,.55), inset 0 0 18px rgba(255,234,0,.25)}}
  @keyframes sweep{0%{transform:translateX(-100%)}50%{transform:translateX(100%)}100%{transform:translateX(100%)}}

  /* ===== BOTTOM: micro answers ticker ===== */
  .ticker{
    display:flex; align-items:center; justify-content:space-between;
    gap:18px; padding:10px 14px;
    border:1px solid var(--line);
    background:rgba(8,0,18,.6);
    font-family:var(--font-mono); font-size:11px;
    letter-spacing:.12em; color:rgba(245,232,255,.7);
  }
  .ticker > div{display:flex; align-items:center; gap:10px}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 6px var(--cyan)}
  .dot.locked{background:var(--yellow); box-shadow:0 0 6px var(--yellow)}
  .ticker .answered{color:var(--cyan); text-shadow:0 0 6px var(--cyan)}
  .ticker .waiting{color:var(--yellow); text-shadow:0 0 6px var(--yellow)}

  /* Logo top corner */
  .brand{
    position:fixed; top:14px; left:18px; z-index:3;
    font-family:var(--font-display); font-size:13px; letter-spacing:.18em;
    color:var(--pink); text-shadow:0 0 8px var(--pink);
  }
  .brand small{
    display:inline-block; margin-left:8px; padding:1px 6px;
    font-family:var(--font-mono); font-size:9px; letter-spacing:.18em;
    background:rgba(255,46,200,.12); color:var(--pink);
  }
</style>
</head>
<body>
  <div class="sky">
    <div class="sun"></div>
    <div class="grid"></div>
  </div>
  <div class="scanlines"></div>

  <div class="brand">BLINDIFY<small>FRIENDS</small></div>

  <div class="stage">
    <!-- TOP HUD -->
    <div class="hud">
      <div class="pcard">
        <div class="pavatar">T</div>
        <div class="pinfo">
          <span class="pstatus">// HOST</span>
          <span class="pname">Tym</span>
          <span class="pscore">1240 PTS</span>
        </div>
      </div>

      <div class="meta">
        <span class="round">[ ROUND 03 / 10 ]</span>
        <span class="timer">14</span>
        <div class="timer-bar"><span></span></div>
      </div>

      <div class="pcard right">
        <div class="pinfo">
          <span class="pstatus locked">// LOCKED IN</span>
          <span class="pname">Lila</span>
          <span class="pscore">980 PTS</span>
        </div>
        <div class="pavatar">L</div>
      </div>
    </div>

    <!-- MIDDLE: PLAY ZONE -->
    <div class="play">
      <div class="arena">
        <div class="frame"><i></i><b></b></div>
        <span class="arena-label">EXTRAIT_EN_COURS</span>
        <div class="vinyl">
          <div class="vinyl-center"></div>
        </div>
        <span class="arena-hint">DRAG TO SPIN FASTER</span>
      </div>

      <div class="answer">
        <div class="field">
          <label class="flabel">Titre <span class="tag">REQ</span></label>
          <input class="input filled" value="Midnight City" />
        </div>

        <div class="field">
          <label class="flabel">Artiste <span class="tag">REQ</span></label>
          <input class="input" placeholder="Tape le nom de l'artiste..." />
        </div>

        <div class="field">
          <label class="flabel">Qui a ajoute ce titre ? <span class="tag">+30 PTS</span></label>
          <div class="picker">
            <button class="pick cy">
              <span class="pick-avatar">T</span>
              <span class="pick-name">Tym</span>
            </button>
            <button class="pick pk selected">
              <span class="pick-avatar">L</span>
              <span class="pick-name">Lila</span>
            </button>
            <button class="pick pu">
              <span class="pick-avatar">M</span>
              <span class="pick-name">Marin</span>
            </button>
            <button class="pick yl">
              <span class="pick-avatar">A</span>
              <span class="pick-name">Anya</span>
            </button>
          </div>
        </div>

        <button class="submit">&gt; VALIDATE</button>
      </div>
    </div>

    <!-- BOTTOM: answers ticker -->
    <div class="ticker">
      <div>
        <span class="dot locked"></span>
        <span class="answered">// 1/2 LOCKED</span>
        <span style="opacity:.5">|</span>
        <span class="waiting">// WAITING FOR HOST</span>
      </div>
      <div>
        <span class="dot"></span>
        <span>EXTRAIT_LENGTH: 20S</span>
        <span style="opacity:.5">|</span>
        <span>NEXT_ROUND_IN: 06S</span>
      </div>
    </div>
  </div>
</body>
</html>
