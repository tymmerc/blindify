<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blindify - Game (Theater v2)</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --pink:#ff2ec8; --cyan:#00f7ff; --yellow:#ffea00; --purple:#a855f7;
    --bg:#0a0014; --line:rgba(255,255,255,.08);
    --font-display:'Audiowide',cursive;
    --font-mono:'JetBrains Mono',monospace;
    --font-body:'Space Grotesk',sans-serif;
  }
  html,body{height:100%}
  body{
    background:var(--bg); color:#f5e8ff; font-family:var(--font-body);
    overflow:hidden; position:relative; min-height:100vh;
  }

  /* ========================================== */
  /*  BACKGROUND: simulated album cover (blurred) */
  /* ========================================== */
  .cover-bg{
    position:fixed; inset:-12%; z-index:0;
    background:
      /* simulate album cover with overlapping color forms */
      radial-gradient(ellipse 80% 60% at 32% 28%, #ff1f9a 0%, transparent 35%),
      radial-gradient(ellipse 60% 80% at 78% 30%, #2300a8 0%, transparent 45%),
      radial-gradient(ellipse 70% 90% at 22% 72%, #4a00d4 0%, transparent 50%),
      radial-gradient(ellipse 90% 50% at 80% 78%, #ff7a00 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, #1e0048 0%, #08000f 80%),
      #0a0014;
    filter:blur(56px) saturate(1.45) brightness(.9);
    transform:scale(1.08);
    animation:cover-drift 26s ease-in-out infinite alternate;
  }
  @keyframes cover-drift{
    0%{transform:scale(1.08) translate(0,0)}
    100%{transform:scale(1.12) translate(-22px,18px) rotate(.5deg)}
  }

  /* Horizon line + sun synthwave underneath */
  .horizon{
    position:fixed; left:0; right:0; bottom:0; height:38vh; z-index:1;
    pointer-events:none; opacity:.5;
  }
  .horizon::before{
    content:""; position:absolute; left:0; right:0; bottom:32vh;
    height:1px; background:linear-gradient(90deg, transparent 0%, var(--pink) 30%, var(--cyan) 70%, transparent 100%);
    box-shadow:0 0 18px var(--pink), 0 0 32px rgba(255,46,200,.5);
    filter:blur(.4px);
  }
  .horizon::after{
    content:""; position:absolute; left:50%; transform:translateX(-50%);
    bottom:24vh; width:280px; height:280px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,46,200,.45) 0%, rgba(168,85,247,.18) 40%, transparent 65%);
    filter:blur(8px);
  }
  .horizon-grid{
    position:absolute; left:0; right:0; bottom:0; top:32vh;
    background-image:
      linear-gradient(rgba(255,46,200,.18) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,247,255,.18) 1px, transparent 1px);
    background-size:60px 60px;
    transform:perspective(380px) rotateX(62deg);
    transform-origin:center top;
    mask-image:linear-gradient(to top, rgba(0,0,0,.6) 30%, transparent 95%);
    animation:grid-pan 22s linear infinite;
  }
  @keyframes grid-pan{from{background-position:0 0,0 0}to{background-position:0 60px,60px 0}}

  /* Vignette */
  .vignette{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background:
      radial-gradient(circle at 50% 45%, transparent 20%, rgba(10,0,20,.55) 65%, rgba(10,0,20,.98) 100%),
      linear-gradient(180deg, rgba(10,0,20,.45) 0%, transparent 25%, transparent 70%, rgba(10,0,20,.7) 100%);
  }

  /* Grain layer */
  .grain{
    position:fixed; inset:0; z-index:48; pointer-events:none; opacity:.04;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode:overlay;
  }
  /* Scanlines */
  .scanlines{
    position:fixed; inset:0; z-index:49; pointer-events:none;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.32) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:multiply; opacity:.5;
  }
  /* Subtle horizontal beam (CRT roll) */
  .beam{
    position:fixed; left:0; right:0; height:140px; z-index:50; pointer-events:none;
    background:linear-gradient(180deg, transparent 0%, rgba(255,255,255,.04) 50%, transparent 100%);
    transform:translateY(-140px);
    animation:beam 9s linear infinite;
  }
  @keyframes beam{0%{transform:translateY(-140px)}100%{transform:translateY(100vh)}}

  /* ===== Layout ===== */
  .stage{
    position:relative; z-index:3;
    display:grid;
    grid-template-rows:auto 1fr auto;
    height:100vh; padding:18px 26px 22px;
    gap:10px;
  }

  /* ============================== */
  /*  TOP BAR                       */
  /* ============================== */
  .top{
    display:grid; grid-template-columns:1fr auto 1fr;
    align-items:center; gap:18px;
  }
  .brand{
    font-family:var(--font-display); font-size:15px; letter-spacing:.18em;
    color:#fff; text-shadow:0 0 8px var(--pink);
  }
  .brand b{color:var(--pink)}
  .brand small{
    display:inline-block; margin-left:10px; padding:2px 7px;
    font-family:var(--font-mono); font-size:9px; letter-spacing:.18em;
    border:1px solid rgba(255,46,200,.4); color:var(--pink);
    background:rgba(255,46,200,.07);
  }

  /* Center HUD: round + timer + progression dots */
  .hud-wrap{display:flex; flex-direction:column; align-items:center; gap:8px}
  .pill{
    display:flex; align-items:center; gap:20px;
    padding:9px 24px;
    background:rgba(10,0,20,.82);
    border:1px solid rgba(255,46,200,.35);
    backdrop-filter:blur(20px);
    box-shadow:0 0 28px rgba(255,46,200,.18), inset 0 0 22px rgba(168,85,247,.12);
    clip-path:polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
  }
  .pill .round{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.28em; color:rgba(245,232,255,.7);
  }
  .pill .round b{color:var(--cyan); text-shadow:0 0 6px var(--cyan)}
  .pill .sep{width:1px; height:20px; background:rgba(255,255,255,.18)}
  .pill .timer{
    font-family:var(--font-display); font-size:28px; color:var(--yellow); line-height:1;
    text-shadow:0 0 12px var(--yellow), 0 0 28px rgba(255,234,0,.6);
    letter-spacing:.04em;
    min-width:44px; text-align:center;
    transition:color .2s, text-shadow .2s;
  }
  .pill .timer.urgent{
    color:#ff4d6d;
    text-shadow:0 0 14px #ff4d6d, 0 0 30px rgba(255,77,109,.7);
    animation:urgent-pulse .6s ease-in-out infinite;
  }
  @keyframes urgent-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  /* Round dots */
  .rdots{display:flex; gap:7px}
  .rdot{
    width:18px; height:3px; background:rgba(255,255,255,.08); border-radius:1px;
    position:relative;
  }
  .rdot.done{background:var(--cyan); box-shadow:0 0 6px var(--cyan)}
  .rdot.current{
    background:linear-gradient(90deg, var(--cyan), var(--yellow));
    box-shadow:0 0 8px var(--yellow);
    animation:dot-glow 1.4s ease-in-out infinite;
  }
  @keyframes dot-glow{0%,100%{opacity:.7}50%{opacity:1}}

  /* Right: quitter */
  .top-right{display:flex; justify-content:flex-end; align-items:center; gap:8px}
  .vol{
    width:34px; height:34px;
    display:grid; place-items:center;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(10,0,20,.6); cursor:pointer;
  }
  .vol svg{width:14px; height:14px; stroke:rgba(245,232,255,.7); stroke-width:1.5; fill:none}
  .vol:hover{border-color:var(--cyan)}
  .vol:hover svg{stroke:var(--cyan)}
  .quit{
    font-family:var(--font-mono); font-size:10px; letter-spacing:.22em;
    color:rgba(245,232,255,.6); padding:8px 14px;
    border:1px solid rgba(255,255,255,.18); background:rgba(10,0,20,.6);
    cursor:pointer; text-transform:uppercase;
  }
  .quit:hover{color:var(--cyan); border-color:var(--cyan)}

  /* ============================== */
  /*  CENTER STAGE                  */
  /* ============================== */
  .center{
    display:grid;
    grid-template-columns:1fr 320px;
    gap:36px; align-items:center;
    min-height:0;
  }

  .show{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    min-height:0;
  }
  .show-label{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-mono); font-size:10px; letter-spacing:.4em;
    color:rgba(0,247,255,.75); text-shadow:0 0 6px rgba(0,247,255,.5);
  }
  .show-label .bullet{
    width:6px; height:6px; border-radius:50%; background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);
    animation:rec 1.2s ease-in-out infinite;
  }
  @keyframes rec{0%,100%{opacity:1}50%{opacity:.3}}

  /* Vinyl arena with tonearm */
  .arena{
    position:relative;
    aspect-ratio:1/1;
    max-height:62vh;
    width:100%; max-width:560px;
    display:grid; place-items:center;
  }
  .arena::before{
    content:""; position:absolute; inset:-14%;
    background:
      radial-gradient(circle, rgba(0,247,255,.45) 0%, rgba(255,46,200,.28) 35%, transparent 65%);
    filter:blur(22px); z-index:0;
    animation:pulse-glow 3.2s ease-in-out infinite;
  }
  @keyframes pulse-glow{0%,100%{opacity:.65; transform:scale(1)}50%{opacity:1; transform:scale(1.07)}}

  /* Vinyl */
  .vinyl{
    position:relative; width:78%; height:78%; border-radius:50%;
    background:
      conic-gradient(from 0deg, rgba(255,255,255,.06) 0deg, transparent 8deg, transparent 352deg, rgba(255,255,255,.06) 360deg),
      radial-gradient(circle at 50% 50%, #160024 0%, #06000c 70%);
    box-shadow:
      0 0 0 1px rgba(0,247,255,.35),
      0 0 90px rgba(0,247,255,.45),
      0 0 160px rgba(255,46,200,.35),
      inset 0 0 120px rgba(168,85,247,.18);
    animation:spin 14s linear infinite;
    cursor:grab; z-index:1;
  }
  /* Grooves */
  .vinyl::before{
    content:""; position:absolute; inset:6%; border-radius:50%;
    background:repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 4px, rgba(255,255,255,.045) 5px, transparent 6px);
    mix-blend-mode:screen;
  }
  /* Inner blurred cover */
  .vinyl::after{
    content:""; position:absolute; inset:26%; border-radius:50%;
    background:
      radial-gradient(circle at 30% 35%, #ff1f9a 0%, transparent 45%),
      radial-gradient(circle at 70% 65%, #00f7ff 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, #a855f7 0%, transparent 60%),
      #1a0030;
    filter:blur(10px) saturate(1.6);
    box-shadow:inset 0 0 50px rgba(0,0,0,.6);
  }
  .vinyl-center{
    position:absolute; inset:46%; border-radius:50%;
    background:#0a0014;
    border:1.5px solid var(--cyan);
    box-shadow:0 0 14px var(--cyan), 0 0 32px var(--cyan);
    z-index:3;
  }
  .vinyl-center::after{
    content:""; position:absolute; inset:32%; border-radius:50%;
    background:radial-gradient(circle, var(--cyan), #1a0030);
  }
  /* Static highlight (doesn't spin) */
  .gloss{
    position:absolute; inset:11%; border-radius:50%;
    background:linear-gradient(115deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,.04) 20%, transparent 45%);
    pointer-events:none; z-index:2;
    mix-blend-mode:overlay;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Tonearm */
  .tonearm{
    position:absolute; top:-2%; right:-4%;
    width:42%; height:42%; z-index:4;
    transform-origin:90% 18%;
    transform:rotate(28deg);
    pointer-events:none;
  }
  .tonearm-base{
    position:absolute; top:6%; right:6%;
    width:36px; height:36px; border-radius:50%;
    background:linear-gradient(135deg, #2a1f3d, #14081e);
    box-shadow:
      inset 0 0 8px rgba(255,255,255,.1),
      0 0 12px rgba(0,0,0,.5),
      0 0 16px rgba(0,247,255,.35);
    border:1px solid rgba(0,247,255,.4);
  }
  .tonearm-base::after{
    content:""; position:absolute; inset:30%; border-radius:50%;
    background:radial-gradient(circle, var(--cyan), #06000c);
    box-shadow:0 0 8px var(--cyan);
  }
  .tonearm-bar{
    position:absolute; top:14%; right:18%;
    width:6px; height:78%;
    background:linear-gradient(180deg, #6a4a8c, #2a1f3d);
    border-left:1px solid rgba(255,255,255,.18);
    border-right:1px solid rgba(0,0,0,.4);
    transform:rotate(-25deg); transform-origin:top center;
    box-shadow:0 0 6px rgba(168,85,247,.3);
  }
  .tonearm-head{
    position:absolute; bottom:14%; left:24%;
    width:24px; height:14px;
    background:linear-gradient(180deg, #3a2a52, #16091f);
    border:1px solid rgba(0,247,255,.5);
    box-shadow:0 0 8px rgba(0,247,255,.3);
    transform:rotate(-25deg);
  }
  .tonearm-head::after{
    content:""; position:absolute; bottom:-3px; left:30%;
    width:2px; height:6px;
    background:var(--cyan);
    box-shadow:0 0 6px var(--cyan);
  }

  /* Vinyl hint */
  .arena-hint{
    position:absolute; bottom:-2%; left:50%; transform:translateX(-50%);
    font-family:var(--font-mono); font-size:9px; letter-spacing:.25em;
    color:rgba(245,232,255,.4); text-transform:uppercase; z-index:5; white-space:nowrap;
  }

  /* Waveform */
  .wave{
    display:flex; align-items:center; gap:3px;
    width:100%; max-width:480px; height:38px;
    padding:0 8px;
  }
  .wave i{
    flex:1; min-width:2px;
    background:linear-gradient(180deg, var(--cyan) 0%, var(--pink) 100%);
    border-radius:1px;
    box-shadow:0 0 6px rgba(255,46,200,.6);
    animation:wave-up 1s ease-in-out infinite alternate;
    transform-origin:center;
  }
  @keyframes wave-up{from{transform:scaleY(.25)}to{transform:scaleY(1)}}

  /* ============================== */
  /*  RIGHT COLUMN: SCOREBOARD      */
  /* ============================== */
  .score-col{
    display:flex; flex-direction:column; gap:12px;
    align-self:stretch; padding:6px 0;
    position:relative;
  }
  .col-title{
    display:flex; align-items:center; justify-content:space-between;
    font-family:var(--font-mono); font-size:10px; letter-spacing:.28em;
    color:var(--pink); text-shadow:0 0 6px var(--pink); padding:0 4px;
  }
  .col-title .head::before{content:"[ "; color:rgba(255,46,200,.4)}
  .col-title .head::after{content:" ]"; color:rgba(255,46,200,.4)}
  .col-title .live{
    display:flex; align-items:center; gap:6px;
    font-size:9px; color:var(--cyan); text-shadow:0 0 4px var(--cyan);
  }
  .col-title .live .dot{
    width:5px; height:5px; border-radius:50%; background:var(--cyan); box-shadow:0 0 6px var(--cyan);
    animation:rec 1.2s ease-in-out infinite;
  }

  .pchip{
    display:grid;
    grid-template-columns:34px 1fr auto;
    gap:10px; align-items:center;
    padding:10px 12px;
    background:rgba(10,0,20,.74);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(14px);
    position:relative;
    transition:border-color .2s, transform .25s;
  }
  .pchip.you{border-color:rgba(0,247,255,.45); box-shadow:0 0 22px rgba(0,247,255,.2)}
  .pchip.lead{
    border-color:rgba(255,234,0,.5);
    box-shadow:0 0 22px rgba(255,234,0,.22);
  }
  .pchip.lead::before{
    content:"#1"; position:absolute; top:-7px; right:-4px;
    font-family:var(--font-display); font-size:9px; padding:2px 6px;
    background:var(--yellow); color:#0a0014; letter-spacing:.1em;
    box-shadow:0 0 10px rgba(255,234,0,.6);
    clip-path:polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
  }

  /* Ranking change indicator */
  .rank{
    position:absolute; left:-4px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; display:grid; place-items:center;
    font-size:10px; line-height:1; font-family:var(--font-mono);
  }
  .rank.up{color:var(--cyan); text-shadow:0 0 4px var(--cyan)}
  .rank.down{color:#ff4d6d; text-shadow:0 0 4px #ff4d6d}
  .rank.eq{color:rgba(245,232,255,.3)}

  .pavatar{
    width:34px; height:34px; flex-shrink:0;
    display:grid; place-items:center;
    border:1.5px solid currentColor; border-radius:2px;
    font-family:var(--font-display); font-size:14px;
    position:relative;
  }
  .pchip.cy .pavatar{color:var(--cyan)}
  .pchip.pk .pavatar{color:var(--pink)}
  .pchip.pu .pavatar{color:var(--purple)}
  .pchip.yl .pavatar{color:var(--yellow)}
  .pmid{display:flex; flex-direction:column; min-width:0; gap:3px}
  .pname{
    font-family:var(--font-display); font-size:14px; line-height:1; letter-spacing:.04em;
    color:#fff; text-shadow:0 0 4px rgba(255,255,255,.3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    display:flex; align-items:center; gap:6px;
  }
  .pname .you-tag{
    font-family:var(--font-mono); font-size:8px; letter-spacing:.16em;
    color:var(--cyan); padding:1px 4px; background:rgba(0,247,255,.12);
  }
  .pstatus{
    font-family:var(--font-mono); font-size:9px; letter-spacing:.16em;
    color:rgba(245,232,255,.45); text-transform:uppercase;
    display:flex; align-items:center; gap:5px;
  }
  .pstatus.locked{color:var(--yellow); text-shadow:0 0 4px var(--yellow)}
  .pstatus .pdot{
    width:5px; height:5px; border-radius:50%;
    background:rgba(245,232,255,.3);
  }
  .pstatus.locked .pdot{background:var(--yellow); box-shadow:0 0 6px var(--yellow)}
  .pstatus.typing .pdot{background:var(--cyan); box-shadow:0 0 6px var(--cyan); animation:rec 1s ease-in-out infinite}

  .pright{display:flex; flex-direction:column; align-items:flex-end; gap:2px}
  .pscore{
    font-family:var(--font-mono); font-size:15px; font-weight:700; color:#fff;
    text-shadow:0 0 6px rgba(255,255,255,.4); letter-spacing:.04em;
    line-height:1;
  }
  .pscore-label{
    font-family:var(--font-mono); font-size:8px; letter-spacing:.15em; color:rgba(245,232,255,.4);
  }

  /* Floating +PTS chip */
  .ppts{
    position:absolute; top:6px; right:14px;
    font-family:var(--font-display); font-size:11px;
    color:var(--yellow); text-shadow:0 0 8px var(--yellow);
    letter-spacing:.08em;
    animation:pts-float 2s ease-out forwards;
    pointer-events:none;
  }
  @keyframes pts-float{
    0%{opacity:0; transform:translateY(8px) scale(.9)}
    20%{opacity:1; transform:translateY(0) scale(1.1)}
    80%{opacity:1; transform:translateY(-14px) scale(1)}
    100%{opacity:0; transform:translateY(-22px) scale(1)}
  }

  /* ============================== */
  /*  BOTTOM DOCK                   */
  /* ============================== */
  .dock{
    display:grid;
    grid-template-columns:1.1fr 1.1fr 1.7fr auto;
    gap:14px; align-items:end;
    padding:14px 18px 14px;
    background:rgba(10,0,20,.72);
    border:1px solid rgba(255,46,200,.25);
    backdrop-filter:blur(22px);
    box-shadow:
      0 0 44px rgba(255,46,200,.12),
      inset 0 0 24px rgba(168,85,247,.08),
      0 -8px 30px rgba(10,0,20,.6);
    position:relative;
  }
  .dock::before{
    content:"[ INPUT_DECK ]";
    position:absolute; top:-9px; left:18px;
    font-family:var(--font-mono); font-size:10px; letter-spacing:.28em;
    color:var(--pink); background:var(--bg); padding:0 8px;
    text-shadow:0 0 6px var(--pink);
  }
  .dock::after{
    content:"// 1/2 ANSWERS LOCKED";
    position:absolute; top:-9px; right:18px;
    font-family:var(--font-mono); font-size:10px; letter-spacing:.22em;
    color:var(--cyan); background:var(--bg); padding:0 8px;
    text-shadow:0 0 6px var(--cyan);
  }

  .field{display:flex; flex-direction:column; gap:6px; min-width:0}
  .flabel{
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-mono); font-size:10px; letter-spacing:.22em;
    color:rgba(245,232,255,.55); text-transform:uppercase;
  }
  .flabel .tag{
    font-family:var(--font-mono); font-size:8px; padding:1px 5px;
    background:rgba(255,234,0,.18); color:var(--yellow); letter-spacing:.18em;
    text-shadow:0 0 4px rgba(255,234,0,.5);
  }
  .flabel .check{
    width:14px; height:14px; display:grid; place-items:center;
    border:1px solid var(--cyan); color:var(--cyan); font-size:9px;
    box-shadow:0 0 6px rgba(0,247,255,.4);
  }
  .input{
    width:100%; background:rgba(8,0,18,.7);
    border:1px solid rgba(255,255,255,.1);
    border-radius:2px; padding:11px 14px;
    color:#fff; font-family:var(--font-body); font-size:14px;
    outline:none; transition:border-color .2s, box-shadow .2s;
  }
  .input:focus{
    border-color:var(--cyan);
    box-shadow:0 0 14px rgba(0,247,255,.3), inset 0 0 12px rgba(0,247,255,.04);
  }
  .input.filled{
    border-color:rgba(0,247,255,.5);
    box-shadow:0 0 12px rgba(0,247,255,.18), inset 0 0 12px rgba(0,247,255,.04);
  }
  .input::placeholder{color:rgba(245,232,255,.25)}

  .picker{display:flex; gap:6px}
  .pick{
    flex:1; min-width:0;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:7px 6px 6px; border-radius:2px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(8,0,18,.5);
    cursor:pointer; transition:all .2s;
    position:relative;
  }
  .pick:hover{border-color:var(--purple); background:rgba(168,85,247,.08)}
  .pick.selected{
    border-color:var(--yellow); background:rgba(255,234,0,.08);
    box-shadow:0 0 16px rgba(255,234,0,.3);
  }
  .pick.selected::before{
    content:"✓"; position:absolute; top:2px; right:5px;
    font-size:9px; color:var(--yellow); text-shadow:0 0 4px var(--yellow);
  }
  .pick-avatar{
    width:24px; height:24px;
    display:grid; place-items:center;
    border:1px solid currentColor; border-radius:2px;
    font-family:var(--font-display); font-size:12px;
  }
  .pick.cy .pick-avatar{color:var(--cyan)}
  .pick.pk .pick-avatar{color:var(--pink)}
  .pick.pu .pick-avatar{color:var(--purple)}
  .pick.yl .pick-avatar{color:var(--yellow)}
  .pick-name{
    font-family:var(--font-mono); font-size:9px; color:rgba(245,232,255,.7);
    letter-spacing:.06em;
  }

  /* Submit */
  .submit{
    padding:14px 26px;
    font-family:var(--font-display); font-size:17px; letter-spacing:.18em;
    background:linear-gradient(180deg, rgba(255,234,0,.1), rgba(255,234,0,.02));
    border:2px solid var(--yellow); color:var(--yellow);
    text-shadow:0 0 10px var(--yellow), 0 0 24px rgba(255,234,0,.5);
    text-transform:uppercase; cursor:pointer;
    clip-path:polygon(16px 0, 100% 0, calc(100% - 16px) 100%, 0 100%);
    position:relative; overflow:hidden;
    animation:breathe 2s ease-in-out infinite;
    transition:transform .15s;
    align-self:end; height:fit-content;
    min-width:170px;
  }
  .submit:hover{transform:translateY(-1px)}
  .submit::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,234,0,.25), transparent);
    transform:translateX(-100%);
    animation:sweep 2.6s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{box-shadow:0 0 18px rgba(255,234,0,.28), inset 0 0 12px rgba(255,234,0,.15)}50%{box-shadow:0 0 36px rgba(255,234,0,.6), inset 0 0 20px rgba(255,234,0,.28)}}
  @keyframes sweep{0%{transform:translateX(-100%)}55%{transform:translateX(110%)}100%{transform:translateX(110%)}}

  /* responsive sizing */
  @media (max-width:1180px){
    .center{grid-template-columns:1fr 260px; gap:24px}
  }
</style>
</head>
<body>

  <script>
    // Mini waveform: randomize per-bar height ceiling
    document.querySelectorAll('.wave i').forEach(b => {
      const max = parseFloat(b.style.getPropertyValue('--max') || '.8');
      b.animate(
        [
          { transform: `scaleY(${(Math.random()*.3 + .15).toFixed(2)})` },
          { transform: `scaleY(${max.toFixed(2)})` }
        ],
        { duration: 600 + Math.random()*500, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' }
      );
    });

    // Vinyl drag-to-spin-faster
    const vinyl = document.querySelector('.vinyl');
    let spinDur = 14; // s
    let dragging = false; let lastAngle = 0; let lastTime = 0;
    function center(){const r=vinyl.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
    function angle(e){const c=center();return Math.atan2(e.clientY-c.y,e.clientX-c.x)*180/Math.PI}
    vinyl.addEventListener('mousedown', e => { dragging = true; lastAngle = angle(e); lastTime = Date.now(); vinyl.style.cursor='grabbing' });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      const a = angle(e); let d = a - lastAngle;
      if (d > 180) d -= 360; if (d < -180) d += 360;
      const dt = Math.max(8, Date.now() - lastTime);
      const speed = Math.abs(d) / dt; // deg/ms
      spinDur = Math.max(1.5, 14 - speed * 40);
      vinyl.style.animationDuration = spinDur + 's';
      lastAngle = a; lastTime = Date.now();
    });
    window.addEventListener('mouseup', () => { dragging = false; vinyl.style.cursor='grab'; setTimeout(() => { vinyl.style.animationDuration = '14s' }, 800) });

    // Timer countdown demo
    const timer = document.querySelector('.pill .timer');
    let t = 8;
    setInterval(() => {
      t = t > 0 ? t - 1 : 20;
      timer.textContent = String(t).padStart(2, '0');
      timer.classList.toggle('urgent', t <= 10);
    }, 1000);
  </script>
