services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: blindify-postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: blindify
      POSTGRES_USER: blindify
      POSTGRES_PASSWORD: ${DB_PASSWORD:-blindify_pass}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.mjs:/docker-entrypoint-initdb.d/init-db.mjs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blindify"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blindify-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: blindify-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    ports:
      # Use a non-default host port to avoid conflicts with local Redis instances
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blindify-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blindify-backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      E2E_BYPASS_KEY: ${E2E_BYPASS_KEY:-}
      PORT: 3000
      DATABASE_URL: postgres://blindify:${DB_PASSWORD:-blindify_pass}@postgres:5432/blindify
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Mail a Tym au debut d'une vraie partie (T18), meme config que la sonde
      # de prod. La cle Resend reste dans son fichier : il est monte en lecture
      # seule ci-dessous. Sans ces variables, le backend demarre sans mail
      # (journal : notif_partie_desactivee).
      ALERTE_DESTINATAIRE: ${ALERTE_DESTINATAIRE:-}
      ALERTE_EXPEDITEUR: ${ALERTE_EXPEDITEUR:-}
      RESEND_CLE_FICHIER: ${RESEND_CLE_FICHIER:+/run/blindz/resend.env}
      # Lien spectateur signe (T18) : `openssl rand -hex 32`. Sans lui, pas de lien.
      SPECTATEUR_SECRET: ${SPECTATEUR_SECRET:-}
      # Mode streamer (T5) : lien d'overlay OBS signe, `openssl rand -hex 32`.
      # Sans lui, le lobby dit que le lien d'overlay n'est pas configure.
      OVERLAY_SECRET: ${OVERLAY_SECRET:-}
      # Interrupteur : vide = ouvert, off = coupe (parties en cours comprises).
      STREAMER_MODE: ${STREAMER_MODE:-}
      STREAMER_MAX_GAMES: ${STREAMER_MAX_GAMES:-}
      STREAMER_MAX_VIEWERS: ${STREAMER_MAX_VIEWERS:-}
      STREAMER_MAX_VIEWERS_PER_IP: ${STREAMER_MAX_VIEWERS_PER_IP:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend/logs:/app/logs
      - ${RESEND_CLE_FICHIER:-/dev/null}:/run/blindz/resend.env:ro
    networks:
      - blindify-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  blindify-network:
    driver: bridge
