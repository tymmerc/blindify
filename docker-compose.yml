services:
  db:
    image: postgres:15
    container_name: blindify-db
    restart: always
    environment:
      POSTGRES_USER: blindify
      POSTGRES_PASSWORD: blindify_pass
      POSTGRES_DB: blindify
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: blindify-backend
    restart: always
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db

volumes:
  db_data:
