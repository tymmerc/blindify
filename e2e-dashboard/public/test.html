<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test — ME2ER</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ece7f0; --bg-card: #ffffff; --bg-tag: #e0d4ec;
      --border: #c9b8d6; --border-hover: #a48dba;
      --text: #1e0f2e; --text-secondary: #4a3660; --text-muted: #7d6a92;
      --accent: #8b3fd9; --accent-light: #a45ef0; --accent-bg: rgba(139,63,217,0.1);
      --green: #1d8c4e; --green-bg: #d9f5e6; --green-border: #6ece9a;
      --red: #c92a2a; --red-bg: #fce0e0; --red-border: #f09a9a;
      --amber: #a86b08; --amber-bg: #fcefd0;
      --shadow-sm: 0 1px 4px rgba(50,20,70,0.1);
      --shadow-md: 0 4px 16px rgba(50,20,70,0.12);
      --radius: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Topbar */
    .topbar {
      position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: 0 24px; height: 52px;
      display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow-sm);
    }
    .back { font-size: 13px; color: var(--text-muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); transition: all 0.15s; font-weight: 500; }
    .back:hover { border-color: var(--accent); color: var(--accent); }
    .topbar-title { font-size: 14px; font-weight: 600; }
    .topbar-file { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

    .run-btn {
      background: linear-gradient(135deg, #8b3fd9, #c026d3); color: white; border: none; padding: 8px 20px;
      border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .run-btn:hover { box-shadow: 0 4px 16px rgba(139,63,217,0.35); transform: translateY(-1px); }
    .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px;
      border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600;
    }
    .status-pill .sd { width: 7px; height: 7px; border-radius: 50%; }
    .status-pill.idle { background: var(--bg-tag); color: var(--text-muted); }
    .status-pill.idle .sd { background: var(--text-muted); }
    .status-pill.running { background: var(--amber-bg); color: var(--amber); }
    .status-pill.running .sd { background: var(--amber); animation: blink 1s ease infinite; }
    .status-pill.passed { background: var(--green-bg); color: var(--green); }
    .status-pill.passed .sd { background: var(--green); }
    .status-pill.failed { background: var(--red-bg); color: var(--red); }
    .status-pill.failed .sd { background: var(--red); }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:.3} }

    .dur { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); }

    /* Layout */
    .page { padding: 24px; width: 100%; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    /* Not used anymore but kept for compat */

    /* Sections */
    .section { margin-bottom: 24px; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .section-count { font-family: 'JetBrains Mono', monospace; font-size: 10px; background: var(--bg-tag); padding: 2px 8px; border-radius: 4px; color: var(--text-muted); }

    /* Subtests */
    .subtest { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 4px; transition: all 0.15s; }
    .subtest:hover { border-color: var(--border-hover); box-shadow: var(--shadow-sm); }
    .sub-num { font-family: 'JetBrains Mono', monospace; font-size: 11px; width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: var(--bg-tag); color: var(--text-muted); font-weight: 600; flex-shrink: 0; }
    .sub-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--border); transition: all 0.3s; }
    .sub-dot.passed { background: var(--green); }
    .sub-dot.failed { background: var(--red); }
    .sub-dot.running { background: var(--amber); animation: blink 1s ease infinite; }
    .sub-name { font-size: 13px; flex: 1; color: var(--text-secondary); }
    .sub-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
    .sub-label.passed { background: var(--green-bg); color: var(--green); }
    .sub-label.failed { background: var(--red-bg); color: var(--red); }

    /* Artifacts gallery */
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .art-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm);
    }
    .art-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--border-hover); }
    .art-card img, .art-card video { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: var(--bg-tag); }
    .art-card .placeholder { width: 100%; aspect-ratio: 16/10; background: var(--bg-tag); display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .art-info { padding: 10px 14px; display: flex; align-items: center; gap: 8px; }
    .art-type { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; }
    .art-type.screenshot { background: #dbeafe; color: #2563eb; }
    .art-type.video { background: #ede9fe; color: #7c3aed; }
    .art-type.trace { background: var(--amber-bg); color: var(--amber); }
    .art-name { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Lightbox with nav */
    .lightbox { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
    .lightbox.open { display: flex; }
    .lightbox img, .lightbox video { max-width: 90vw; max-height: 85vh; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .lb-close { position: absolute; top: 16px; right: 20px; background: rgba(255,255,255,0.15); border: none; color: white; font-size: 24px; cursor: pointer; width: 40px; height: 40px; border-radius: 8px; transition: background 0.15s; }
    .lb-close:hover { background: rgba(255,255,255,0.25); }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.15); border: none; color: white;
      font-size: 24px; cursor: pointer; width: 48px; height: 48px; border-radius: 10px;
      transition: background 0.15s; display: flex; align-items: center; justify-content: center;
    }
    .lb-nav:hover { background: rgba(255,255,255,0.3); }
    .lb-nav.prev { left: 16px; }
    .lb-nav.next { right: 16px; }
    .lb-counter {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); color: white; padding: 6px 16px; border-radius: 20px;
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
    }

    /* Console */
    .console {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.6;
      color: var(--text-secondary); white-space: pre-wrap; max-height: 400px; overflow-y: auto;
      box-shadow: var(--shadow-sm);
    }
    .console::-webkit-scrollbar { width: 4px; }
    .console::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .empty { text-align: center; padding: 32px; color: var(--text-muted); font-size: 13px; }

    /* Collapsible results panel */
    .results-toggle {
      display: flex; align-items: center; gap: 8px; padding: 14px 18px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      cursor: pointer; transition: all 0.15s; user-select: none; width: 100%;
      font-size: 14px; font-weight: 600; color: var(--text);
    }
    .results-toggle:hover { border-color: var(--border-hover); box-shadow: var(--shadow-sm); }
    .results-toggle .chevron { transition: transform 0.2s; font-size: 12px; color: var(--text-muted); }
    .results-toggle.open .chevron { transform: rotate(90deg); }
    .results-toggle .rt-count {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      background: var(--bg-tag); padding: 2px 8px; border-radius: 4px; color: var(--text-muted);
    }
    .results-body {
      max-height: 0; overflow: hidden; transition: max-height 0.35s ease;
    }
    .results-body.open { max-height: 3000px; }
    .results-inner { padding: 16px 0 0; }

    /* Source */
    .source {
      background: #282a36; border-radius: var(--radius); padding: 16px;
      font-family: 'JetBrains Mono', monospace; font-size: 11.5px; line-height: 1.6;
      color: #cdd6f4; white-space: pre; overflow-x: auto; max-height: 500px; overflow-y: auto;
    }
    .source::-webkit-scrollbar { width: 4px; height: 4px; }
    .source::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }

    @media (max-width: 900px) {
      .two-col { grid-template-columns: 1fr; }
      .gallery { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back" href="./">&larr; Dashboard</a>
    <span class="topbar-title" id="tTitle">Chargement...</span>
    <span class="topbar-file" id="tFile"></span>
    <div class="topbar-right">
      <span class="dur" id="tDur"></span>
      <span class="status-pill idle" id="tStatus"><span class="sd"></span>idle</span>
      <button class="run-btn" id="tRun" onclick="runTest()">&#9654; Lancer</button>
    </div>
  </div>

  <div class="page" id="app"><div class="empty">Chargement...</div></div>

  <div class="lightbox" id="lightbox">
    <button class="lb-close" onclick="lbClose()">&times;</button>
    <button class="lb-nav prev" onclick="lbPrev()">&lsaquo;</button>
    <div id="lbContent"></div>
    <button class="lb-nav next" onclick="lbNext()">&rsaquo;</button>
    <div class="lb-counter" id="lbCounter"></div>
  </div>

  <script>
    const BASE = new URL('.', document.baseURI).pathname.replace(/\/$/, '')
    const params = new URLSearchParams(location.search)
    const PROJECT = params.get('project')
    const FILE = params.get('file')
    let data = null, polling = null
    let lbItems = [], lbIndex = 0
    let resultsOpen = false
    let selectedRun = null // null = current, or run id

    if (!PROJECT || !FILE) { document.getElementById('app').innerHTML = '<div class="empty">Parametre manquant. <a href="./">Retour</a></div>' }
    else fetchTest()

    async function fetchTest() {
      try {
        const r = await fetch(BASE + '/api/project/' + PROJECT + '/test/' + FILE)
        data = await r.json()
        render()
      } catch(e) { document.getElementById('app').innerHTML = '<div class="empty">Erreur. <a href="./">Retour</a></div>' }
    }

    function render() {
      const t = data
      document.title = t.name + ' — ME2ER'
      document.getElementById('tTitle').textContent = t.project + ' / ' + t.name
      document.getElementById('tFile').textContent = t.file

      // Apply project theme
      if (t.theme) {
        const th = t.theme, r = document.documentElement.style
        r.setProperty('--accent', th.accent)
        r.setProperty('--accent-light', th.accentLight)
        r.setProperty('--accent-bg', th.accentBg)
        r.setProperty('--bg', th.bg)
        r.setProperty('--bg-tag', th.bgTag)
        r.setProperty('--border', th.border)
        r.setProperty('--border-hover', th.borderHover)
        r.setProperty('--text-secondary', th.textSecondary)
        r.setProperty('--text-muted', th.textMuted)
        document.getElementById('tRun').style.background = th.gradient
      }
      document.getElementById('tDur').textContent = t.duration ? (t.duration/1000).toFixed(1)+'s' : ''

      const sp = document.getElementById('tStatus')
      sp.className = 'status-pill ' + t.status
      sp.innerHTML = '<span class="sd"></span>' + slabel(t.status)

      const btn = document.getElementById('tRun')
      btn.disabled = t.status === 'running' || t.status === 'queued'
      btn.innerHTML = btn.disabled ? 'En cours...' : '&#9654; Lancer'

      const subs = t.subtests || []
      const a = t.artifacts || { screenshots: [], videos: [], traces: [] }
      const allMedia = [...a.screenshots.map(s=>({...s,type:'screenshot'})), ...a.videos.map(v=>({...v,type:'video'}))]
      lbItems = allMedia
      const hist = t.history || []
      const hasResults = (t.output && t.output.trim()) || allMedia.length > 0 || a.traces.length > 0
      const artCount = allMedia.length + a.traces.length

      // Auto-open results when test finishes or a run is selected
      if (t.status === 'passed' || t.status === 'failed' || selectedRun) resultsOpen = true

      // Determine which results to show: selected run or current
      let showOutput = t.output || ''
      let showArtifacts = a
      let showStatus = t.status
      let showRunLabel = 'Dernier run'
      if (selectedRun && t._selectedRunData) {
        showOutput = t._selectedRunData.output || ''
        showArtifacts = t._selectedRunData.artifacts || { screenshots: [], videos: [], traces: [] }
        showStatus = t._selectedRunData.status
        const rd = new Date(t._selectedRunData.timestamp)
        showRunLabel = 'Run du ' + rd.toLocaleDateString('fr-FR', {day:'numeric',month:'short'}) + ' a ' + rd.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'})
      }

      let html = ''

      // ── Description + Sous-tests (always visible) ──
      html += `<div class="section"><div class="section-title">Description</div>`
      html += `<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;font-size:13.5px;line-height:1.6;color:var(--text-secondary);">`
      html += esc(t.description || 'Aucune description.')
      html += `</div></div>`

      html += `<div class="section"><div class="section-title">Sous-tests <span class="section-count">${subs.length}</span></div>`
      html += subs.map((s,i) => {
        const st = getSubStatus(s, t)
        return `<div class="subtest"><div class="sub-num">${i+1}</div><div class="sub-dot ${st}"></div><span class="sub-name">${esc(s)}</span>${st ? '<span class="sub-label '+st+'">'+st+'</span>' : ''}</div>`
      }).join('')
      html += '</div>'

      // ── Collapsible: Resultats du dernier run ──
      html += `<div class="section">`
      const sa = showArtifacts
      const sMedia = [...(sa.screenshots||[]).map(s=>({...s,type:'screenshot'})), ...(sa.videos||[]).map(v=>({...v,type:'video'}))]
      lbItems = sMedia
      const sArtCount = sMedia.length + (sa.traces||[]).length
      const sHasResults = (showOutput && showOutput.trim()) || sArtCount > 0

      html += `<div class="results-toggle ${resultsOpen?'open':''}" onclick="toggleResults()">
        <span class="chevron">&#9654;</span>
        ${esc(showRunLabel)}
        ${selectedRun ? '<span style="font-size:11px;color:var(--accent);margin-left:8px;cursor:pointer;" onclick="event.stopPropagation();clearRun()">&#10005; revenir au courant</span>' : ''}
        ${sHasResults ? '<span class="rt-count">'+sArtCount+' artefact'+(sArtCount>1?'s':'')+'</span>' : ''}
      </div>`
      html += `<div class="results-body ${resultsOpen?'open':''}"><div class="results-inner">`

      if (!sHasResults && !selectedRun && t.status === 'idle') {
        html += '<div class="empty">Aucun resultat. Lance le test ou clique sur un run dans l\'historique.</div>'
      } else {
        // Artifacts
        if (sArtCount > 0) {
          html += `<div class="section"><div class="section-title">Artefacts <span class="section-count">${sArtCount}</span></div><div class="gallery">`
          ;(sa.screenshots||[]).forEach((s,i) => {
            html += `<div class="art-card" onclick="lbOpen(${i})"><img src="${BASE+s.url}" loading="lazy"><div class="art-info"><span class="art-type screenshot">screenshot</span><span class="art-name">${esc(s.name)}</span></div></div>`
          })
          ;(sa.videos||[]).forEach((v,i) => {
            html += `<div class="art-card" onclick="lbOpen(${(sa.screenshots||[]).length+i})"><video src="${BASE+v.url}" muted preload="metadata"></video><div class="art-info"><span class="art-type video">video</span><span class="art-name">${esc(v.name)}</span></div></div>`
          })
          ;(sa.traces||[]).forEach(tr => {
            html += `<div class="art-card" onclick="window.open('${BASE+tr.url}')"><div class="placeholder">&#128270;</div><div class="art-info"><span class="art-type trace">trace</span><span class="art-name">${esc(tr.name)}</span></div></div>`
          })
          html += '</div></div>'
        }

        // Console
        html += `<div class="section"><div class="section-title">Console</div>`
        html += showOutput && showOutput.trim() ? `<div class="console">${esc(showOutput)}</div>` : '<div class="empty">Aucune sortie.</div>'
        html += '</div>'

        // Source
        html += `<div class="section"><div class="section-title">Code source</div><div class="source">${esc(t.source || '')}</div></div>`
      }

      html += '</div></div></div>'

      // ── Historique (always visible, at bottom) ──
      html += `<div class="section"><div class="section-title">Historique <span class="section-count">${hist.length} run${hist.length>1?'s':''}</span></div>`
      if (hist.length === 0) {
        html += '<div class="empty">Aucun run enregistre. Lance le test pour voir apparaitre l\'historique.</div>'
      } else {
        html += '<div style="display:flex;flex-direction:column;gap:4px;">'
        hist.forEach((h,i) => {
          const d = new Date(h.timestamp)
          const time = d.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit',second:'2-digit'})
          const date = d.toLocaleDateString('fr-FR', {day:'numeric',month:'short',year:'numeric'})
          const dur = (h.duration/1000).toFixed(1)+'s'
          const isSel = selectedRun === h.id
          html += `<div class="subtest" style="cursor:pointer;${isSel ? 'border-color:var(--accent);background:var(--accent-bg);' : ''}" onclick="loadRun('${h.id}')">
            <div class="sub-num">${i+1}</div>
            <div class="sub-dot ${h.status}"></div>
            <span class="sub-name">${date} a ${time}</span>
            <span class="sub-label ${h.status}">${h.status}</span>
            <span style="font-family:JetBrains Mono,monospace;font-size:11px;color:var(--text-muted);">${dur}</span>
            ${isSel ? '<span style="font-size:10px;color:var(--accent);font-weight:600;">&#9664; affiche</span>' : ''}
          </div>`
        })
        html += '</div>'
      }
      html += '</div>'

      document.getElementById('app').innerHTML = html
    }

    function getSubStatus(name, t) {
      if (t.status === 'idle') return ''
      if (t.status === 'running') return 'running'
      // Parse from output
      const clean = (t.output||'').replace(/\x1b\[[0-9;]*m/g, '')
      if (clean.includes(name.slice(0, 30))) {
        if (t.status === 'passed') return 'passed'
        // Check if this specific test failed
        const lines = clean.split('\n')
        for (const l of lines) {
          if (l.includes(name.slice(0,20)) && (l.includes('✘') || l.includes('×') || l.includes('failed'))) return 'failed'
        }
        if (t.status === 'failed') return 'passed' // default to passed if not specifically failed
      }
      return t.status === 'passed' ? 'passed' : t.status === 'failed' ? 'failed' : ''
    }

    function toggleResults() { resultsOpen = !resultsOpen; render() }

    async function loadRun(runId) {
      if (selectedRun === runId) { clearRun(); return }
      selectedRun = runId
      resultsOpen = true
      try {
        const r = await fetch(BASE + '/api/project/' + PROJECT + '/test/' + FILE + '/run/' + runId)
        const runData = await r.json()
        data._selectedRunData = runData
        render()
        // Scroll to results
        document.querySelector('.results-toggle')?.scrollIntoView({ behavior: 'smooth', block: 'start' })
      } catch(e) { console.error(e) }
    }

    function clearRun() {
      selectedRun = null
      delete data._selectedRunData
      render()
    }
    function slabel(s) { return {idle:'Pret',queued:'En attente',running:'En cours...',passed:'Passed',failed:'Failed'}[s]||s }
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }

    async function runTest() {
      await fetch(BASE+'/api/project/'+PROJECT+'/run/'+FILE, {method:'POST'})
      startPolling()
    }
    function startPolling() {
      if (polling) return; fetchTest()
      polling = setInterval(async () => {
        await fetchTest()
        if (data && data.status !== 'running' && data.status !== 'queued') { clearInterval(polling); polling = null }
      }, 1000)
    }

    // Lightbox with navigation
    function lbOpen(i) {
      lbIndex = i; lbShow()
      document.getElementById('lightbox').classList.add('open')
    }
    function lbClose() { document.getElementById('lightbox').classList.remove('open') }
    function lbPrev() { lbIndex = (lbIndex - 1 + lbItems.length) % lbItems.length; lbShow() }
    function lbNext() { lbIndex = (lbIndex + 1) % lbItems.length; lbShow() }
    function lbShow() {
      const item = lbItems[lbIndex]; if (!item) return
      const c = document.getElementById('lbContent')
      if (item.type === 'screenshot') c.innerHTML = `<img src="${BASE+item.url}">`
      else c.innerHTML = `<video src="${BASE+item.url}" controls autoplay style="max-width:90vw;max-height:85vh;border-radius:8px;"></video>`
      document.getElementById('lbCounter').textContent = (lbIndex+1) + ' / ' + lbItems.length
    }
    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return
      if (e.key === 'Escape') lbClose()
      if (e.key === 'ArrowLeft') lbPrev()
      if (e.key === 'ArrowRight') lbNext()
    })

    // Auto-poll if running
    setTimeout(() => { if (data && (data.status === 'running' || data.status === 'queued')) startPolling() }, 2000)
  </script>
</body>
</html>
