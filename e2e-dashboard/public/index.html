<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ME2ER — E2E Test Runner</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ece7f0; --bg-card: #ffffff; --bg-card-hover: #f5f0fa;
      --bg-nav: rgba(255,255,255,0.95); --bg-tag: #e0d4ec;
      --border: #c9b8d6; --border-hover: #a48dba;
      --text: #1e0f2e; --text-secondary: #4a3660; --text-muted: #7d6a92;
      --accent: #8b3fd9; --accent-light: #a45ef0; --accent-bg: rgba(139,63,217,0.1);
      --green: #1d8c4e; --green-bg: #d9f5e6; --green-border: #6ece9a;
      --red: #c92a2a; --red-bg: #fce0e0; --red-border: #f09a9a;
      --amber: #a86b08; --amber-bg: #fcefd0; --amber-border: #e8c45a;
      --shadow-sm: 0 1px 4px rgba(50,20,70,0.1);
      --shadow-md: 0 4px 16px rgba(50,20,70,0.12);
      --shadow-lg: 0 8px 28px rgba(50,20,70,0.15);
      --radius: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Nav ── */
    nav {
      position: sticky; top: 0; z-index: 100; background: var(--bg-nav);
      border-bottom: 1px solid var(--border); padding: 0 clamp(16px, 4vw, 48px);
      display: flex; align-items: center; height: 56px; box-shadow: var(--shadow-sm);
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; margin-right: 32px; }
    .nav-brand-icon {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, #8b3fd9, #d946a8); display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: white;
      box-shadow: 0 2px 8px rgba(139,63,217,0.3);
    }
    .nav-brand h1 { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
    .nav-tabs { display: flex; gap: 4px; height: 100%; align-items: stretch; }
    .nav-tab {
      display: flex; align-items: center; gap: 6px; padding: 0 16px;
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      text-decoration: none; border-bottom: 2px solid transparent;
      transition: all 0.15s; cursor: pointer;
    }
    .nav-tab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    .nav-tab .tab-dot { width: 8px; height: 8px; border-radius: 50%; }
    .nav-tab .tab-count {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      background: var(--bg-tag); padding: 2px 6px; border-radius: 4px; color: var(--text-muted);
    }
    .nav-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .view-btn {
      font-size: 16px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.15s;
    }
    .view-btn:hover { color: var(--text); border-color: var(--border-hover); }
    .view-btn.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
    .run-all-btn {
      background: linear-gradient(135deg, #8b3fd9, #c026d3); color: white; border: none; padding: 8px 20px;
      border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .run-all-btn:hover { box-shadow: 0 4px 16px rgba(139,63,217,0.35); transform: translateY(-1px); }
    .run-all-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Stats ── */
    .stats-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      padding: 20px 24px;
    }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 20px; box-shadow: var(--shadow-sm); transition: all 0.2s; cursor: pointer;
      user-select: none;
    }
    .stat-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .stat-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg), var(--shadow-md); }
    .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 700; }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-weight: 500; }
    .stat-card.total { border-bottom: 3px solid var(--accent); }
    .stat-card.total .stat-val { color: var(--accent); }
    .stat-card.passed { border-bottom: 3px solid var(--green); }
    .stat-card.passed .stat-val { color: var(--green); }
    .stat-card.failed { border-bottom: 3px solid var(--red); }
    .stat-card.failed .stat-val { color: var(--red); }
    .stat-card.running { border-bottom: 3px solid var(--amber); }
    .stat-card.running .stat-val { color: var(--amber); }

    /* ── Main ── */
    main { padding: 4px 24px 48px; }

    /* ── Test grid ── */
    .tests-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 12px; margin-top: 16px; }

    .test-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 20px; text-decoration: none; color: inherit; display: block;
      box-shadow: var(--shadow-sm); transition: all 0.2s; position: relative;
    }
    .test-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); border-color: var(--border-hover); }
    .test-card.passed { border-left: 4px solid var(--green); background: linear-gradient(90deg, var(--green-bg) 0%, var(--bg-card) 30%); }
    .test-card.failed { border-left: 4px solid var(--red); background: linear-gradient(90deg, var(--red-bg) 0%, var(--bg-card) 30%); }
    .test-card.running { border-left: 4px solid var(--amber); background: linear-gradient(90deg, var(--amber-bg) 0%, var(--bg-card) 30%); }

    .tc-top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .tc-icon { font-size: 20px; }
    .tc-name { font-size: 14px; font-weight: 600; flex: 1; }
    .tc-status {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
      border-radius: 6px; font-family: 'JetBrains Mono', monospace;
      font-size: 10px; font-weight: 600;
    }
    .tc-status.idle { background: var(--bg-tag); color: var(--text-muted); }
    .tc-status.queued { background: var(--bg-tag); color: var(--text-secondary); }
    .tc-status.running { background: var(--amber-bg); color: var(--amber); }
    .tc-status.passed { background: var(--green-bg); color: var(--green); }
    .tc-status.failed { background: var(--red-bg); color: var(--red); }
    .tc-status .sd { width: 6px; height: 6px; border-radius: 50%; }
    .tc-status.idle .sd { background: var(--text-muted); }
    .tc-status.running .sd { background: var(--amber); animation: blink 1s ease infinite; }
    .tc-status.passed .sd { background: var(--green); }
    .tc-status.failed .sd { background: var(--red); }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    .tc-file { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .tc-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tc-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .tc-meta { display: flex; gap: 8px; }
    .tc-tag {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      background: var(--bg-tag); padding: 3px 8px; border-radius: 4px; color: var(--text-muted);
    }
    .tc-dur { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); }
    .tc-arrow { color: var(--text-muted); font-size: 16px; transition: all 0.15s; }
    .test-card:hover .tc-arrow { color: var(--accent); transform: translateX(3px); }

    /* Category filters */
    .cat-filters {
      display: flex; gap: 6px; padding: 0 24px 12px; flex-wrap: wrap; align-items: center;
    }
    .cat-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-right: 4px; }
    .cat-pill {
      font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500;
      padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text-secondary); cursor: pointer;
      transition: all 0.15s; user-select: none;
    }
    .cat-pill:hover { border-color: var(--border-hover); color: var(--text); }
    .cat-pill.active { background: var(--accent); border-color: var(--accent); color: white; }
    .cat-pill .pill-count {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      margin-left: 4px; opacity: 0.7;
    }

    /* List view */
    .tests-list { display: flex; flex-direction: column; gap: 6px; margin-top: 16px; }
    .tests-list .test-card {
      display: flex; align-items: center; gap: 14px; padding: 12px 18px;
    }
    .tests-list .tc-top { margin-bottom: 0; flex: 1; }
    .tests-list .tc-file, .tests-list .tc-desc { display: none; }
    .tests-list .tc-bottom { margin-top: 0; }
    .tests-list .tc-arrow { display: none; }

    .empty-state { text-align: center; padding: 60px; color: var(--text-muted); font-size: 14px; }

    footer { text-align: center; padding: 32px; color: var(--text-muted); font-size: 12px; }

    @media (max-width: 700px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .tests-grid { grid-template-columns: 1fr; }
      .nav-tabs { overflow-x: auto; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-brand">
      <div class="nav-brand-icon">M</div>
      <h1>ME2ER</h1>
    </div>
    <div class="nav-tabs" id="navTabs"></div>
    <div class="nav-right">
      <button class="view-btn" id="vGrid" onclick="setView('grid')" title="Grille">&#9638;</button>
      <button class="view-btn" id="vList" onclick="setView('list')" title="Liste">&#9776;</button>
      <button class="run-all-btn" id="runAllBtn" onclick="runAll()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Tout lancer
      </button>
    </div>
  </nav>

  <div class="stats-row" id="stats"></div>
  <div class="cat-filters" id="catFilters"></div>
  <main id="app"></main>
  <footer>ME2ER — Multi-project E2E Runner</footer>

  <script>
    const BASE = new URL('.', document.baseURI).pathname.replace(/\/$/, '')
    let projects = [], tests = [], polling = null
    let currentProject = null
    let filterStatus = 'all'
    let filterCategory = 'all'
    let viewMode = 'grid'

    async function init() {
      const r = await fetch(BASE + '/api/projects')
      projects = await r.json()
      if (projects.length > 0) {
        const saved = localStorage.getItem('me2er_project')
        currentProject = projects.find(p => p.id === saved) ? saved : projects[0].id
        applyTheme(currentProject)
        renderNav()
        loadProject(currentProject)
      }
    }

    function renderNav() {
      document.getElementById('navTabs').innerHTML = projects.map(p =>
        `<a class="nav-tab ${p.id === currentProject ? 'active' : ''}" onclick="switchProject('${p.id}')">
          <span class="tab-dot" style="background:${p.theme.accent}"></span>
          ${esc(p.name)}
          <span class="tab-count">${p.testCount}</span>
        </a>`
      ).join('')
    }

    function switchProject(id) {
      currentProject = id
      localStorage.setItem('me2er_project', id)
      applyTheme(id)
      renderNav()
      loadProject(id)
    }

    function applyTheme(id) {
      const p = projects.find(p => p.id === id)
      if (!p || !p.theme) return
      const t = p.theme
      const r = document.documentElement.style
      r.setProperty('--accent', t.accent)
      r.setProperty('--accent-light', t.accentLight)
      r.setProperty('--accent-bg', t.accentBg)
      r.setProperty('--bg', t.bg)
      r.setProperty('--bg-tag', t.bgTag)
      r.setProperty('--border', t.border)
      r.setProperty('--border-hover', t.borderHover)
      r.setProperty('--text-secondary', t.textSecondary)
      r.setProperty('--text-muted', t.textMuted)
      r.setProperty('--shadow-sm', `0 1px 4px ${t.shadow},0.1)`)
      r.setProperty('--shadow-md', `0 4px 16px ${t.shadow},0.12)`)
      r.setProperty('--shadow-lg', `0 8px 28px ${t.shadow},0.15)`)
      // Update gradient buttons
      document.querySelectorAll('.run-all-btn').forEach(b => b.style.background = t.gradient)
      document.querySelectorAll('.nav-brand-icon').forEach(b => b.style.background = t.gradient)
    }

    async function loadProject(id) {
      const r = await fetch(BASE + '/api/project/' + id + '/tests')
      tests = await r.json()
      render()
    }

    function render() {
      const p = tests.filter(t => t.status === 'passed').length
      const f = tests.filter(t => t.status === 'failed').length
      const r = tests.filter(t => t.status === 'running' || t.status === 'queued').length
      const subs = tests.reduce((a,t) => a + (t.subtests||[]).length, 0)

      document.getElementById('stats').innerHTML = `
        <div class="stat-card total ${filterStatus==='all'?'selected':''}" onclick="setFilter('all')"><div class="stat-val">${tests.length}</div><div class="stat-label">${subs} sous-tests</div></div>
        <div class="stat-card passed ${filterStatus==='passed'?'selected':''}" onclick="setFilter('passed')"><div class="stat-val">${p}</div><div class="stat-label">Passed</div></div>
        <div class="stat-card failed ${filterStatus==='failed'?'selected':''}" onclick="setFilter('failed')"><div class="stat-val">${f}</div><div class="stat-label">Failed</div></div>
        <div class="stat-card running ${filterStatus==='running'?'selected':''}" onclick="setFilter('running')"><div class="stat-val">${r}</div><div class="stat-label">${r > 0 ? 'En cours...' : 'Idle'}</div></div>
      `
      document.getElementById('runAllBtn').disabled = r > 0
      document.getElementById('vGrid').className = 'view-btn' + (viewMode==='grid' ? ' active' : '')
      document.getElementById('vList').className = 'view-btn' + (viewMode==='list' ? ' active' : '')

      // Category pills
      const cats = new Map()
      tests.forEach(t => { const c = t.category || 'Autre'; cats.set(c, (cats.get(c)||0) + 1) })
      let catHtml = '<span class="cat-label">Type :</span>'
      catHtml += `<span class="cat-pill ${filterCategory==='all'?'active':''}" onclick="setCat('all')">Tous<span class="pill-count">${tests.length}</span></span>`
      for (const [c, count] of cats) {
        catHtml += `<span class="cat-pill ${filterCategory===c?'active':''}" onclick="setCat('${c}')">${esc(c)}<span class="pill-count">${count}</span></span>`
      }
      document.getElementById('catFilters').innerHTML = catHtml

      // Filter tests
      let filtered = tests
      if (filterStatus !== 'all') {
        if (filterStatus === 'running') filtered = filtered.filter(t => t.status === 'running' || t.status === 'queued')
        else if (filterStatus === 'idle') filtered = filtered.filter(t => t.status === 'idle')
        else filtered = filtered.filter(t => t.status === filterStatus)
      }
      if (filterCategory !== 'all') {
        filtered = filtered.filter(t => (t.category || 'Autre') === filterCategory)
      }

      if (filtered.length === 0) {
        document.getElementById('app').innerHTML = '<div class="empty-state">Aucun test ne correspond au filtre.</div>'
        return
      }

      const containerClass = viewMode === 'list' ? 'tests-list' : 'tests-grid'
      let html = `<div class="${containerClass}">`
      for (const t of filtered) {
        const dur = t.duration ? (t.duration/1000).toFixed(1)+'s' : ''
        const st = t.status !== 'idle' ? t.status : ''
        html += `
          <a class="test-card ${st}" href="test.html?project=${currentProject}&file=${encodeURIComponent(t.file)}">
            <div class="tc-top">
              <span class="tc-name">${esc(t.name)}</span>
              <span class="tc-status ${t.status}"><span class="sd"></span>${slabel(t.status)}</span>
            </div>
            <div class="tc-file">${esc(t.file)}</div>
            ${t.description ? '<div class="tc-desc">'+esc(t.description)+'</div>' : ''}
            <div class="tc-bottom">
              <div class="tc-meta">
                <span class="tc-tag">${esc(t.category || 'Autre')}</span>
                <span class="tc-tag">${(t.subtests||[]).length} tests</span>
                ${dur ? '<span class="tc-dur">' + dur + '</span>' : ''}
              </div>
              <span class="tc-arrow">&rarr;</span>
            </div>
          </a>`
      }
      html += '</div>'
      document.getElementById('app').innerHTML = html
    }

    function slabel(s) { return {idle:'idle',queued:'queued',running:'en cours',passed:'passed',failed:'failed'}[s]||s }
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML }
    function setFilter(s) { filterStatus = (filterStatus === s && s !== 'all') ? 'all' : s; render() }
    function setCat(c) { filterCategory = (filterCategory === c && c !== 'all') ? 'all' : c; render() }
    function setView(v) { viewMode = v; render() }

    async function runAll() {
      await fetch(BASE+'/api/project/'+currentProject+'/run-all', {method:'POST'})
      startPolling()
    }
    function startPolling() {
      if (polling) return
      polling = setInterval(async () => {
        await loadProject(currentProject)
        if (!tests.some(t => t.status==='running'||t.status==='queued')) { clearInterval(polling); polling = null }
      }, 1500)
    }

    init()
  </script>
</body>
</html>
