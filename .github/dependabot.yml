# Dependabot ouvre des PR de mise a jour ; chacune passe par la CI et la
# protection de main comme n'importe quelle PR. Les mises a jour mineures et
# correctives sont groupees pour ne pas noyer le depot sous les PR ; les
# versions majeures arrivent une par une, a relire.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      front-mineures:
        update-types: [minor, patch]
    ignore:
      # @types/node decrit l'API d'une version de Node : il suit celle qui fait
      # tourner le code (22, voir .nvmrc et backend/Dockerfile), pas la derniere
      # parue. Ses majeures se montent a la main, dans la meme PR que Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      back-mineures:
        update-types: [minor, patch]
    ignore:
      # Meme regle que pour le front.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Image de base du backend (ligne FROM de backend/Dockerfile). L'etiquette
  # node:22-alpine ne donne que la version majeure : Dependabot ne peut donc
  # proposer que des montees de majeure, a relire une par une (une majeure
  # impaire de Node n'a jamais de LTS : celle-la se refuse a la relecture).
  # Accepter une montee, c'est aussi monter .nvmrc et @types/node dans la meme
  # PR (Dependabot ne touche qu'a la ligne FROM). Une seule image, rien a
  # grouper.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

  # docker-compose.yml n'est pas surveille, expres : postgres:15-alpine et
  # redis:7-alpine ne donnent eux aussi que la majeure, et aucune des deux
  # montees ne se fait en changeant l'etiquette. Les donnees d'un Postgres 15
  # ne demarrent pas sous une version plus recente (pg_upgrade ou sauvegarde
  # puis restauration), et Redis n'est utilise par aucun code.

  # Outils du depot (husky, lint-staged).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"

  # Les actions sont epinglees par SHA : Dependabot met a jour le SHA et le
  # commentaire de version. Il ne lit pas seul les actions composites, d'ou le
  # second dossier.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-node-app
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
