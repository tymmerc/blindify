worker_processes auto;
events { worker_connections 1024; }

http {
    # Preserve proper Upgrade header for WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream blindify_backend {
        server 127.0.0.1:3000;
    }

    server {
        listen 80;
        server_name tymmerc.eu www.tymmerc.eu;

        # Portfolio root
        root /opt/portfolio/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # API proxy
        location ~ ^/blindify/api/(.*)$ {
            proxy_pass http://blindify_backend/api/$1;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Auth proxy (only the OAuth entrypoint)
        location = /blindify/auth/spotify/login {
            proxy_pass http://blindify_backend/auth/spotify/login;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.io (supports both /socket.io and /blindify/socket.io)
        location /socket.io/ {
            proxy_pass http://blindify_backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /blindify/socket.io/ {
            proxy_pass http://blindify_backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Blindify static export (basePath=/blindify)
        location /blindify/_next/static/ {
            alias /opt/blindify/frontend/out/_next/static/;
            access_log off;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        }

        location = /blindify {
            return 301 /blindify/;
        }

        location /blindify/ {
            alias /opt/blindify/frontend/out/;
            # Prefer exported .html before falling back to directories to avoid 403 on paths like /auth/callback
            try_files $uri.html $uri/index.html $uri /index.html;
            # Cache static assets lightly; force fresh HTML to avoid stale UI
            add_header Cache-Control "public, max-age=300" always;
        }

        # No-cache for HTML documents (forces latest build)
        location ~* ^/blindify/(.*\.html)$ {
            alias /opt/blindify/frontend/out/$1;
            try_files $uri /index.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        }
    }
}
