worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream blindify_backend {
        server 127.0.0.1:3000;
    }

    server {
        listen 80;
        server_name tymmerc.eu www.tymmerc.eu;

        # Portfolio root
        root /opt/portfolio/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # API proxy
        location ~ ^/blindify/api/(.*)$ {
            proxy_pass http://blindify_backend/api/$1;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth proxy
        location ~ ^/blindify/auth/(.*)$ {
            proxy_pass http://blindify_backend/auth/$1;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.io
        location /blindify/socket.io/ {
            proxy_pass http://blindify_backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Blindify static export (basePath=/blindify)
        location /blindify/_next/static/ {
            alias /opt/blindify/frontend/out/_next/static/;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /blindify {
            return 301 /blindify/;
        }

        location /blindify/ {
            alias /opt/blindify/frontend/out/;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=300";
        }
    }
}
