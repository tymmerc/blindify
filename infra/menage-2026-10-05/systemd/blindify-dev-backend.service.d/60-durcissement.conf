# Backend de DEV hors de root (audit menage technique du 05/10/2026).
# Pose par scripts/go-prod-2026-10-05-services-dev.sh apres le GO de Tym.
# Retour arriere : supprimer ce fichier, systemctl daemon-reload, restart.
#
# Pourquoi : ce service repond sur Internet sans mot de passe
# (dev.tymmerc.eu/blindify/api/) et ecrit dans la base de PROD avec le role
# proprietaire. En root, une faille dans le code de dev ou une dependance
# donnait toute la machine : les autres projets, tous les .env, la socket
# docker. Ici il ne lit que le code et ne peut ecrire que ses journaux.
[Service]
User=blindz-dev-back
Group=blindz-dev-back

# Node copie hors de /root (dossier ferme aux autres utilisateurs) et lance
# sans npx : un processus npm de moins (environ 50 Mo).
ExecStart=
ExecStart=/opt/node/v22.21.1/bin/node /opt/blindify/backend/node_modules/.bin/ts-node-dev --respawn --transpile-only src/index.ts
Environment=PATH=/opt/node/v22.21.1/bin:/usr/bin:/bin

# Boucle locale seulement : nginx est devant. Avant : 0.0.0.0 (seul ufw
# empechait l'acces direct au port 3097).
Environment=LISTEN_HOST=127.0.0.1

# Journaux et fichiers televerses a part. logs/ est monte dans le conteneur
# de PROD : dev et prod ecrivaient dans les memes error.log et combined.log.
LogsDirectory=blindz-dev-back
Environment=LOG_DIR=/var/log/blindz-dev-back
StateDirectory=blindz-dev-back
Environment=LOCAL_UPLOAD_DIR=/var/lib/blindz-dev-back/uploads

# Bac a sable : disque en lecture seule sauf les dossiers ci-dessus, /tmp
# prive (ts-node-dev y compile), pas de /root ni /home, aucune capacite.
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictSUIDSGID=yes
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
SystemCallErrorNumber=EPERM
CapabilityBoundingSet=
AmbientCapabilities=
UMask=0027
# MemoryDenyWriteExecute n'est PAS mis : le JIT de V8 en a besoin.

# Garde-fou memoire (gel du VPS du 30/09) : mesure a ~120 Mo en service.
MemoryHigh=512M
MemoryMax=768M
