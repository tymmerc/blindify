# Explorateur de base (dev.tymmerc.eu/blindz/api/) durci (audit du 05/10/2026).
# Pose par scripts/go-prod-2026-10-05-services-dev.sh apres le GO de Tym.
# Retour arriere : supprimer ce fichier, systemctl daemon-reload, restart.
#
# Il RESTE root : il lit l'etat et les erreurs du backend avec `docker inspect`
# et `docker logs`, et avoir acces a la socket docker revient a etre root.
# Changer d'utilisateur ne protegerait donc rien tant que ces appels existent
# (piste dans le document d'audit). Ce durcissement retire tout le reste :
# aucune capacite (root ne passe plus outre les droits des fichiers), disque
# en lecture seule, /root et /home caches sauf le mot de passe du role
# blindz_ro, /tmp prive.
[Service]
ExecStart=
ExecStart=/opt/node/v22.21.1/bin/node /opt/blindify/tools/db-browser.mjs
Environment=PATH=/opt/node/v22.21.1/bin:/usr/bin:/bin
CapabilityBoundingSet=
AmbientCapabilities=
# Lire /var/log/nginx/access.log (www-data:adm, 640) sans capacite.
SupplementaryGroups=adm
ProtectHome=tmpfs
BindReadOnlyPaths=/root/.blindz-ro-pass

NoNewPrivileges=yes
ProtectSystem=strict
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
SystemCallErrorNumber=EPERM
UMask=0077
MemoryMax=512M
