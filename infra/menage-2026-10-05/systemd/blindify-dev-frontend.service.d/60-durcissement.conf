# Front de DEV (next dev) hors de root (audit menage technique du 05/10/2026).
# Pose par scripts/go-prod-2026-10-05-services-dev.sh apres le GO de Tym.
# Retour arriere : supprimer ce fichier, systemctl daemon-reload, restart.
#
# Pourquoi : next dev repond sur Internet sans mot de passe
# (dev.tymmerc.eu/blindify/) et un serveur de developpement n'est pas fait
# pour ca. En root il pouvait aussi reecrire frontend/out/, qui EST le site
# de prod blindz.app. Ici il ne voit que le front et Node, et n'ecrit que
# dans son dossier .next-dev.
[Service]
User=blindz-dev-front
Group=blindz-dev-front

ExecStart=
ExecStart=/opt/node/v22.21.1/bin/node /opt/blindify/frontend/node_modules/.bin/next dev -p 3099 -H 127.0.0.1
Environment=PATH=/opt/node/v22.21.1/bin:/usr/bin:/bin
# Dossier de travail a lui (next.config.js) : next build, en root, garde .next.
Environment=NEXT_DIST_DIR=.next-dev
# Sinon Next tente d'ecrire sa config de telemetrie dans un HOME inexistant.
Environment=NEXT_TELEMETRY_DISABLED=1

# /opt vide, sauf le code du front et Node : ProtectSystem=strict laisse tout
# LIRE, et des .env d'autres projets de /opt sont lisibles par tous (644).
# Seuls .next-dev et next-env.d.ts (reecrit par Next a chaque demarrage,
# ignore par git) sont remontes en ecriture.
TemporaryFileSystem=/opt:ro
BindReadOnlyPaths=/opt/blindify/frontend /opt/node/v22.21.1
BindPaths=/opt/blindify/frontend/.next-dev /opt/blindify/frontend/next-env.d.ts

NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictSUIDSGID=yes
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
# AF_NETLINK : next dev liste les interfaces reseau au demarrage
# (os.networkInterfaces), qui echoue sans lui (verifie le 05/10/2026).
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
SystemCallErrorNumber=EPERM
CapabilityBoundingSet=
AmbientCapabilities=
UMask=0027

# Garde-fou memoire : 450 a 700 Mo mesures le 05/10 (cgroup du service actuel,
# MemoryCurrent et MemoryPeak), le haut pendant une compilation.
MemoryHigh=1G
MemoryMax=1536M
