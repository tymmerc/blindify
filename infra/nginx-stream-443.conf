# Multiplexage du port 443 entre SSH et HTTPS, en remplacement de sslh.
#
# Pourquoi : sslh 1.22c ne sait pas parler le protocole PROXY (verifie, il
# ignore l'option en silence) et son mode transparent casse les connexions que
# le serveur ouvre vers son propre nom public, dont vivent le monitoring et les
# scripts de deploiement. nginx sait faire les deux proprement.
#
# ssl_preread regarde les premiers octets sans les consommer : un ClientHello
# TLS renseigne $ssl_preread_protocol, le banner SSH le laisse vide.

stream {
    log_format mux '$remote_addr [$time_local] proto="$ssl_preread_protocol" '
                   'vers=$upstream_addr octets=$bytes_sent/$bytes_received';
    access_log /var/log/nginx/stream-443.log mux;

    map $ssl_preread_protocol $cible_443 {
        ""      ssh_sans_entete;   # pas de TLS : c'est SSH
        default https_local;
    }

    # HTTPS : nginx se parle a lui-meme sur 8443, en annoncant la vraie adresse
    # du client dans un en-tete PROXY.
    upstream https_local     { server 127.0.0.1:8443; }
    # SSH : sshd ne sait pas lire un en-tete PROXY, on passe par un etage qui le
    # retire avant de livrer un flux TCP ordinaire.
    upstream ssh_sans_entete { server 127.0.0.1:2223; }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $cible_443;
        proxy_timeout 12h;   # les sessions SSH restent ouvertes longtemps
    }

    server {
        listen 127.0.0.1:2223 proxy_protocol;   # lit l'en-tete, puis l'enleve
        proxy_pass 127.0.0.1:2222;
        proxy_timeout 12h;
    }
}
