# Activite Discord : la page /discord/ de blindz.app est chargee dans l'iframe
# d'une Activite par le PROXY de Discord. Correspondances du portail developpeur
# (docs/DISCORD-POUR-TYM.md) :
#   /                    -> blindz.app/discord       (la page de l'Activite)
#   /blindz              -> blindz.app               (API et socket, sous /.proxy/blindz)
#   /dzcdn/{subdomain}   -> {subdomain}.dzcdn.net    (extraits Deezer)
#
# Consequences pour nginx, et rien d'autre :
#  1. La page est demandee comme racine du proxy : ses ressources arrivent ici
#     sous /discord/ (le proxy colle "/discord" devant tout). /discord/_next/...
#     doit servir /_next/..., et /discord/logo-mark.png le logo de la racine.
#  2. Le proxy transmet nos en-tetes au navigateur, qui voit la page sous
#     https://<id>.discordsays.com dans une iframe de discord.com. Les
#     en-tetes du site (X-Frame-Options SAMEORIGIN, frame-ancestors 'self')
#     interdisent exactement cela : pour /discord/ SEULEMENT, pas de
#     X-Frame-Options et des frame-ancestors limites aux clients Discord.
#     Le reste de la CSP est celui du site ; les requetes de la page visent
#     'self' (son origine est celle du proxy).
#
# A inclure dans le bloc server HTTPS de /etc/nginx/sites-enabled/13-blindz.conf,
# AVANT "location / {" :
#     include /opt/blindify/infra/nginx/blindz-discord.conf;
# puis nginx -t et systemctl reload nginx. Retour arriere : retirer l'include.
# Les blocs ^~ gagnent sur "location /" (prefixe plus long) et ne regardent
# pas les regex. Les add_header sont redeclares : nginx n'herite pas de ceux
# du bloc parent des qu'un bloc en pose un.

location ^~ /discord/_next/ {
    alias /opt/blindify/frontend/out/_next/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /discord/ {
    root /opt/blindify/frontend/out;
    # La page, ou une ressource de la racine demandee sous /discord/ (logo,
    # icones, manifeste). Tout le reste retombe sur la page.
    try_files $uri $uri/index.html @discord_racine;
    add_header Cache-Control "public, max-age=300" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; media-src 'self' data: blob: https://*.dzcdn.net; connect-src 'self' https://*.dzcdn.net; frame-ancestors https://discord.com https://*.discord.com https://discordapp.com https://*.discordapp.com https://*.discordsays.com; base-uri 'self';" always;
}

location @discord_racine {
    # /discord/logo-mark.png -> /logo-mark.png ; une page inconnue -> /discord/
    rewrite ^/discord/(.+\.(png|ico|svg|webmanifest|woff2|txt|xml))$ /$1 last;
    rewrite ^ /discord/index.html last;
}
