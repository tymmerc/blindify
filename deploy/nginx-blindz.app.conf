# ==========================================================================
# blindz.app — vhost dédié (app à la RACINE, plus de /blindify)
# À activer au basculement : copier dans /etc/nginx/sites-enabled/13-blindz.conf
# APRÈS avoir obtenu le certificat :
#   certbot certonly --webroot -w /var/www/html -d blindz.app -d www.blindz.app
# (ou certbot --nginx -d blindz.app -d www.blindz.app)
# Puis: nginx -t && systemctl reload nginx
# ==========================================================================

# HTTP :80 -> redirige vers HTTPS (et laisse passer l'ACME challenge)
server {
    listen 80;
    listen [::]:80;
    server_name blindz.app www.blindz.app;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://blindz.app$request_uri; }
}

# HTTPS (derrière sslh :443 -> nginx :8443)
server {
    listen 127.0.0.1:8443 ssl;
    listen [::1]:8443 ssl;
    server_name blindz.app www.blindz.app;

    ssl_certificate     /etc/letsencrypt/live/blindz.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blindz.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # www -> apex
    if ($host = www.blindz.app) { return 301 https://blindz.app$request_uri; }

    # --- API ---
    location ~ ^/api/(.*)$ {
        proxy_pass http://blindify_backend/api/$1$is_args$args;
        include /etc/nginx/snippets/proxy-params.conf;
        limit_req zone=blindify_limit burst=200 nodelay;
    }

    # --- Auth server-side OAuth ---
    location = /auth/spotify/login {
        proxy_pass http://blindify_backend/auth/spotify/login$is_args$args;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # --- Socket.io (websocket) ---
    location = /socket.io { return 308 /socket.io/; }
    location /socket.io/ {
        proxy_pass http://blindify_backend/socket.io/;
        include /etc/nginx/snippets/proxy-params-ws.conf;
    }

    # --- App statique (build RACINE : NEXT_PUBLIC_BASE_PATH="") ---
    location / {
        root /opt/blindify/frontend/out;
        index index.html;
        try_files $uri $uri/index.html $uri.html /index.html;
        add_header Cache-Control "public, max-age=300" always;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.spotify.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; media-src 'self' data: blob: https://*.scdn.co https://*.spotifycdn.com https://*.dzcdn.net; connect-src 'self' https://api.spotify.com https://accounts.spotify.com wss://blindz.app https://*.dzcdn.net; frame-src https://accounts.spotify.com; frame-ancestors 'self' https://blindz.app; base-uri 'self';" always;
    }

    limit_req zone=blindify_limit burst=200 nodelay;
}
