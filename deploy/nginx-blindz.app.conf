# ==========================================================================
# MIROIR de /etc/nginx/sites-enabled/13-blindz.conf (aligne le 28/10/2026, T15),
# avec les changements de T15 : CSP sans accounts.spotify.com ni
# api.spotify.com, plus de relais /auth/spotify/login (OAuth retire).
#
# NE JAMAIS COPIER CE FICHIER SUR LE FICHIER EN PLACE. On modifie le fichier en
# place a la main (ligne par ligne), puis `nginx -t`, puis
# `systemctl reload nginx`. Avant le 28/10 ce miroir avait diverge (pas de
# proxy_protocol sur le 443) : une copie aurait fait tomber le site.
# ==========================================================================
# blindz.app — app à la racine (basePath vide). HTTP->HTTPS + ACME.
server {
    listen 80;
    listen [::]:80;
    server_name blindz.app;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://blindz.app$request_uri; }
}

# HTTPS (derrière sslh :443 -> nginx :8443)
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    listen [::1]:8443 ssl proxy_protocol;
    server_name blindz.app;

    ssl_certificate     /etc/letsencrypt/live/blindz.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blindz.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Journal dedie a blindz.app pour les statistiques de visites (GoAccess,
    # 05/10/2026). Un access_log pose ici REMPLACE celui herite du bloc http :
    # on remet donc aussi le journal global, que d'autres outils lisent encore.
    # $remote_addr est la vraie adresse du client (real_ip + PROXY du 443, voir
    # nginx.conf). Rotation : /etc/logrotate.d/nginx couvre /var/log/nginx/*.log.
    # Retour arriere : /opt/backups/nginx-13-blindz.conf-avant-journal-20261005T120003Z
    access_log /var/log/nginx/access.log combined;
    access_log /var/log/nginx/blindz-access.log combined;

    location ~ ^/api/(.*)$ {
        proxy_pass http://blindify_backend/api/$1$is_args$args;
        include /etc/nginx/snippets/proxy-params.conf;
        limit_req zone=blindify_limit burst=200 nodelay;
    }
    location = /socket.io { return 308 /socket.io/; }
    location /socket.io/ {
        proxy_pass http://blindify_backend/socket.io/;
        include /etc/nginx/snippets/proxy-params-ws-fixed.conf;
    }
    location /_next/static/ {
        root /opt/blindify/frontend/out;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Activite Discord (14/10/2026, PR #73) : en-tetes d'iframe assouplis pour /discord seulement.
    include /opt/blindify/infra/nginx/blindz-discord.conf;

    location / {
        root /opt/blindify/frontend/out;
        index index.html;
        try_files $uri $uri/index.html $uri.html /index.html;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; media-src 'self' data: blob: https://*.scdn.co https://*.spotifycdn.com https://*.dzcdn.net; connect-src 'self' wss://blindz.app https://*.dzcdn.net; frame-ancestors 'self' https://blindz.app; base-uri 'self';" always;
    }
    limit_req zone=blindify_limit burst=200 nodelay;
}
